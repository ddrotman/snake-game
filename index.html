<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pac-Man Surf 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1622; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; transition: filter 1.2s; }
  canvas.high { filter: saturate(1.5) hue-rotate(-12deg) contrast(1.05); }
  .glass { background: rgba(8, 18, 32, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.16); }
  #hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 9px 20px; border-radius: 22px; font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
  #hud span { white-space: nowrap; opacity: 0.92; }
  #hud b { color: #ffe14d; font-variant-numeric: tabular-nums; margin-left: 6px; }
  #place { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; text-shadow: 0 1px 8px #000; white-space: nowrap; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 16px; pointer-events: none; transition: background 0.4s; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.55); }
  #overlay.dim { background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.55)); }
  #title { margin: 0; font-size: clamp(38px, 9vw, 104px); font-weight: 900; letter-spacing: 0.05em; color: #ffe14d; }
  #sub { margin-top: 12px; font-size: clamp(15px, 2.3vw, 22px); max-width: 720px; line-height: 1.4; }
  #toast { position: fixed; top: 96px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 16px; font-weight: 700; font-size: 16px; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #haze { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.5s; background: radial-gradient(ellipse at center, rgba(120, 255, 140, 0) 35%, rgba(70, 150, 60, 0.32) 80%, rgba(40, 90, 40, 0.55)); }
  #smoke { position: fixed; inset: -10%; pointer-events: none; opacity: 0; transition: opacity 2s; overflow: hidden; }
  #smoke i { position: absolute; width: 70vmax; height: 45vmax; border-radius: 50%; background: radial-gradient(closest-side, rgba(228, 234, 226, 0.6), rgba(228, 234, 226, 0)); filter: blur(18px); animation: drift 18s ease-in-out infinite alternate; }
  #smoke i:nth-child(1) { left: -15%; top: 5%; }
  #smoke i:nth-child(2) { right: -20%; top: 35%; animation-duration: 23s; animation-delay: -6s; }
  #smoke i:nth-child(3) { left: 15%; bottom: -20%; animation-duration: 27s; animation-delay: -12s; }
  #smoke i:nth-child(4) { right: 10%; top: -20%; animation-duration: 31s; animation-delay: -3s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1) rotate(0deg); } to { transform: translate(14vw, -10vh) scale(1.35) rotate(25deg); } }
  #help { position: fixed; bottom: 12px; left: 16px; right: 16px; text-align: center; font-size: 12px; opacity: 0.8; pointer-events: none; text-shadow: 0 1px 6px #000; }
  #controls { position: fixed; left: 16px; right: 16px; bottom: 36px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  #controls .group { display: flex; gap: 8px; }
  #controls button { pointer-events: auto; padding: 9px 14px; border-radius: 14px; color: #fff; font: inherit; font-size: 14px; cursor: pointer; }
  #controls button:disabled { opacity: 0.4; cursor: default; }
  #controls .group { flex-wrap: wrap; max-width: calc(100vw - 150px); }
  #controls button.pulse { animation: pulse 0.6s ease-in-out infinite alternate; border-color: #7ff; }
  @keyframes pulse { from { box-shadow: 0 0 0 rgba(127, 255, 255, 0); } to { box-shadow: 0 0 18px rgba(127, 255, 255, 0.9); } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #speech { position: fixed; transform: translate(-50%, -100%); padding: 8px 14px; border-radius: 16px; background: #fff; color: #c2002f; font-weight: 800; font-size: 15px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.25s; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); }
  #speech::after { content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 8px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .popup { position: fixed; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; color: #9ff; text-shadow: 0 0 12px #0ff; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="haze"></div>
<div id="smoke"><i></i><i></i><i></i><i></i></div>
<div id="hud" class="glass">
  <span>Score<b id="score">0</b></span>
  <span>Best<b id="best">0</b></span>
  <span>Level<b id="level">1</b></span>
  <span>Lives<b id="lives">3</b></span>
</div>
<div id="place"></div>
<div id="toast" class="glass"></div>
<div id="speech"></div>
<div id="flash"></div>
<div id="overlay" class="dim"><h1 id="title">Loading…</h1><div id="sub"></div></div>
<div id="controls">
  <div class="group">
    <button id="beerBtn" class="glass">🍺 Beer <b id="beerCount">0</b></button>
    <button id="jointBtn" class="glass">🌿 Joint <b id="jointCount">0</b></button>
    <button id="diveBtn" class="glass">🤿 Dive <b id="diveCount">X</b></button>
    <button id="surfBtn" class="glass">🏄 Surf <b>F</b></button>
    <button id="fishBtn" class="glass">🎣 Fish <b id="fishCount">G</b></button>
  </div>
  <button id="view" class="glass">Camera: Follow</button>
</div>
<div id="help">Arrows move · F surf (↑ ↓ tricks) · X dive · G fish · B beer · J joint · Space pause · C camera</div>

<script>
  // Shown if the 3D engine never loads (offline, blocked CDN, no WebGL).
  setTimeout(() => {
    if (!window.__started) {
      document.getElementById('title').textContent = 'Couldn’t start 3D';
      document.getElementById('sub').textContent = 'This game needs WebGL and an internet connection to load Three.js.';
    }
  }, 10000);
</script>
<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- maps & destinations
// # wall, . pearl, o big pearl, - stingray-pen gate, space = empty water
const MAPS = {
  A: [
    '###################',
    '#........#........#',
    '#o##.###.#.###.##o#',
    '#.................#',
    '#.##.#.#####.#.##.#',
    '#....#...#...#....#',
    '####.###.#.###.####',
    '####.#.......#.####',
    '####.#.##-##.#.####',
    ' ......#   #...... ',
    '####.#.#####.#.####',
    '####.#.......#.####',
    '####.#.#####.#.####',
    '#........#........#',
    '#.##.###.#.###.##.#',
    '#o.#..... .....#.o#',
    '##.#.#.#####.#.#.##',
    '#....#...#...#....#',
    '#.######.#.######.#',
    '#.................#',
    '###################',
  ],
  B: [
    '###################',
    '#o...............o#',
    '#.####.##.##.####.#',
    '#.................#',
    '#.##.#..###..#.##.#',
    '#....#...#...#....#',
    '####.###.#.###.####',
    '####.#.......#.####',
    '####.#.##-##.#.####',
    ' ......#   #...... ',
    '####.#.#####.#.####',
    '####.#.......#.####',
    '####.#.#####.#.####',
    '#....#.......#....#',
    '#.##.#.#####.#.##.#',
    '#o....... .......o#',
    '##.#.#.#####.#.#.##',
    '#....#...#...#....#',
    '#.######.#.######.#',
    '#.................#',
    '###################',
  ],
};
const DESTINATIONS = [
  {name: 'Malibu, California', map: 'A', elevation: 17, azimuth: 200, turbidity: 6, rayleigh: 1.6, water: 0x0a5f6e, sun: 0xffe0b5, exposure: 0.5, waveEvery: 16, waveHeight: 1.8},
  {name: 'Waikiki, Hawaii', map: 'B', elevation: 48, azimuth: 165, turbidity: 3, rayleigh: 1.1, water: 0x0b8790, sun: 0xfff4e2, exposure: 0.32, waveEvery: 13, waveHeight: 2.0},
  {name: 'Uluwatu, Bali', map: 'A', elevation: 7, azimuth: 190, turbidity: 10, rayleigh: 3, water: 0x0a4152, sun: 0xffa060, exposure: 0.6, waveEvery: 11, waveHeight: 2.2, beach: true},
  {name: 'Nazaré, Portugal', map: 'B', elevation: 10, azimuth: 235, turbidity: 16, rayleigh: 0.9, water: 0x113c48, sun: 0xdfe4ff, exposure: 0.55, waveEvery: 8, waveHeight: 2.7},
];
const W = 19, H = 21;
let MAP = MAPS.A;
const dest = () => DESTINATIONS[(level - 1) % DESTINATIONS.length];

// ---------------------------------------------------------------- game logic
const UP = {x: 0, y: -1}, LEFT = {x: -1, y: 0}, DOWN = {x: 0, y: 1}, RIGHT = {x: 1, y: 0}, NONE = {x: 0, y: 0};
const DIRS = [UP, LEFT, DOWN, RIGHT];
const MODES = [7, 20, 7, 20, 5, 20, 5, Infinity]; // seconds, alternating scatter / chase
const HOME = {x: 9, y: 9}, EXIT = {x: 9, y: 7};
const RAYS = [
  {name: 'blinky', color: 0xff3b30, start: {x: 9, y: 7}, dir: LEFT, corner: {x: W - 2, y: -2}, release: 0},
  {name: 'pinky', color: 0xff8ce8, start: {x: 9, y: 9}, dir: UP, corner: {x: 1, y: -2}, release: 5},
];
const BEER_TIME = 420, JOINT_TIME = 420, RED_EYES_EXTRA = 240;
const DIVE_TIME = 240, DIVE_COOLDOWN = 480, AIR_TIME = 48, HOOK_TIME = 70;

let dots, dotsLeft, pac, queued, ghosts, crabs, items, popups, wave;
let score = 0, lives = 5, level = 1, state = 'start', timer = 0, paused = false;
let frame = 0, roundTime = 0, modeIndex = 0, modeTime = 0, frightTime = 0, combo = 0, freeze = 0;
let beerTime = 0, jointTime = 0, redEyes = 0, waveClock = 0, waveWarned = false, itemClock = 0;
let inv = {beer: 1, joint: 1};
let toastMsg = '', toastTime = 0, trailReset = true;
let whale = null, ufo = null, discoTime = 0, eventClock = 0, nextEventAt = 1800, lastEvent = '';
let gfMad = 0, gfForgive = 0, speech = '', speechTime = 0, gfFat = 0, gfGlam = false;
let starfish = null, starClock = 0, treasure = null, flashTime = 0;
let best = 0;
try { best = Number(localStorage.getItem('pacBest')) || 0; } catch (e) {}

const isWall = (x, y) => x < 0 || x >= W || y < 0 || y >= H || MAP[y][x] === '#';
const opposite = (a, b) => (a.x || a.y) && a.x === -b.x && a.y === -b.y;
const rpos = e => ({x: e.x + e.dir.x * e.p, y: e.y + e.dir.y * e.p});
const timeScale = () => jointTime > 0 ? 0.45 : 1;
const toast = (msg, frames = 150) => { toastMsg = msg; toastTime = frames; };

function open(x, y, d, doorOK) {
  const nx = (x + d.x + W) % W, ny = y + d.y;
  if (ny < 0 || ny >= H) return false;
  const c = MAP[ny][nx];
  return c !== '#' && (c !== '-' || doorOK);
}

function randomTile(minDist) {
  const tiles = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (MAP[y][x] === '#' || MAP[y][x] === '-') continue;
      if (y >= 8 && y <= 10 && x >= 7 && x <= 11) continue;
      if (y === 9 && (x === 0 || x === W - 1)) continue;
      if ((x - pac.x) ** 2 + (y - pac.y) ** 2 < minDist * minDist) continue;
      tiles.push([x, y]);
    }
  }
  return tiles[Math.floor(Math.random() * tiles.length)];
}

function loadDots() {
  dots = MAP.map(row => row.split('').map(c => (c === '.' || c === 'o') ? c : ''));
  dotsLeft = dots.flat().filter(Boolean).length;
  // Hide a treasure chest on the seafloor under an inner wall next to open water.
  const spots = [];
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      if (MAP[y][x] !== '#' || inPen(x, y) || (y >= 7 && y <= 11 && x >= 6 && x <= 12)) continue;
      if (DIRS.some(d => MAP[y + d.y][x + d.x] !== '#' && MAP[y + d.y][x + d.x] !== '-')) spots.push({x, y});
    }
  }
  treasure = {...spots[Math.floor(Math.random() * spots.length)], found: false};
}

function resetPositions() {
  pac = {x: 9, y: 15, dir: NONE, face: LEFT, p: 0, surge: 0, stun: 0, crabSafe: 0, rayBlind: 0, mode: 'normal', dive: 0, diveCool: 0, sx: 0, drift: 0, lastRow: 0, wantsSurf: false, air: 0, trick: '', combo: 0, fishCool: 0};
  queued = LEFT;
  ghosts = RAYS.map(g => ({...g, x: g.start.x, y: g.start.y, p: 0, state: g.release ? 'house' : 'active', fright: false, abducted: 0, hooked: 0}));
  crabs = Array.from({length: level < 3 ? 1 : 2}, () => {
    const [x, y] = randomTile(6);
    return {x, y, dir: NONE, p: 0, flung: 0};
  });
  items = [];
  popups = [];
  wave = null;
  starfish = null;
  starClock = 0;
  whale = ufo = null;
  roundTime = modeIndex = modeTime = frightTime = freeze = 0;
  beerTime = jointTime = waveClock = itemClock = discoTime = eventClock = 0;
  nextEventAt = 2400 + Math.random() * 900;
  waveWarned = false;
  trailReset = true;
}

function startLevel() { loadDots(); resetPositions(); state = 'ready'; timer = 120; }
function newGame() {
  score = 0; lives = 5; level = 1; gfFat = 0; gfGlam = false; paused = false; redEyes = 0; gfMad = 0; speechTime = 0;
  inv = {beer: 1, joint: 1};
  applyDestination();
  startLevel();
}

function addScore(n) {
  score += n;
  if (score > best) {
    best = score;
    try { localStorage.setItem('pacBest', best); } catch (e) {}
  }
}

const say = (line, frames = 160) => { speech = line; speechTime = frames; };
const MAD_LINES = ['Seriously?! AGAIN?!', 'You PROMISED you quit!', 'Ugh. I can smell that from here.', 'We are SO talking about this later.', 'Don’t even look at me right now.', 'My mom was right about you.', 'Unbelievable.'];

function useItem(type) {
  if (state !== 'play' || paused || !inv[type] || pac.mode !== 'normal') return;
  inv[type]--;
  if (type === 'beer') {
    beerTime = BEER_TIME;
    toast('🍺 Wasted! Controls are all over the place');
  } else {
    jointTime = JOINT_TIME;
    redEyes = JOINT_TIME + RED_EYES_EXTRA;
    gfMad = JOINT_TIME + 240;
    toast('🌿 Duuude… everything slows down');
    say(MAD_LINES[Math.floor(Math.random() * MAD_LINES.length)]);
  }
}

// Dive under the walls for a few seconds; nothing can touch you down there.
function startDive() {
  if (state !== 'play' || paused || pac.mode !== 'normal' || pac.diveCool > 0) return;
  pac.mode = 'dive';
  pac.dive = DIVE_TIME;
  pac.surge = 0;
  pac.stun = 0;
  toast('🤿 Diving! Swim under the walls', 90);
}

// Catch the set wave as it reaches you and ride the crest over the maze.
// Press F any time a wave is on its way: you paddle out and pop up when it reaches you.
function catchWave() {
  if (state !== 'play' || paused || pac.mode !== 'normal') return;
  const rp = rpos(pac);
  if (wave && wave.row > rp.y - 1.5 && wave.row < rp.y + 2.5) { startSurf(); return; }
  if ((wave && wave.row < rp.y) || waveWarned) {
    pac.wantsSurf = true;
    toast('🏄 Paddling out… you’ll catch it when it gets here', 100);
  } else {
    toast('🌊 No wave yet. Watch for the warning!', 70);
  }
}

function startSurf() {
  const rp = rpos(pac);
  pac.mode = 'surf';
  pac.sx = rp.x;
  pac.drift = 0;
  pac.lastRow = wave.row;
  pac.surge = pac.stun = pac.air = pac.combo = 0;
  pac.wantsSurf = false;
  toast('🏄 Riding! ← → carve · ↑ aerial 360 · ↓ backflip', 150);
}

const TRICKS = {spin: 'AERIAL 360', flip: 'BACKFLIP'};
function doTrick(kind) {
  if (pac.air > 0) return;
  pac.air = AIR_TIME;
  pac.trick = kind;
}

function landSurf() {
  // Drop off the back of the wave onto the nearest open water near the bottom.
  let pick = [9, 15], pickDist = Infinity;
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      if (MAP[y][x] === '#' || MAP[y][x] === '-' || (y >= 8 && y <= 10 && x >= 7 && x <= 11)) continue;
      const d = (x - pac.sx) ** 2 + (y - (H - 2)) ** 2 * 0.5;
      if (d < pickDist) { pickDist = d; pick = [x, y]; }
    }
  }
  [pac.x, pac.y] = pick;
  pac.p = 0;
  pac.dir = NONE;
  pac.face = DOWN;
  queued = NONE;
  pac.mode = 'normal';
  pac.rayBlind = pac.crabSafe = 90;
  const bonus = 200 + 150 * pac.combo;
  addScore(bonus);
  popups.push({x: pac.x, y: pac.y, text: pac.combo ? `🏄 ${pac.combo}-TRICK RIDE +${bonus}` : `🏄 TUBE RIDE +${bonus}`, t: 80});
}

// Wipe out every enemy on the board: stingrays swim home, crabs get flung.
function nukeEnemies() {
  let n = 0;
  for (const g of ghosts) {
    if (g.state !== 'active' && g.state !== 'leaving') continue;
    g.state = 'eaten';
    g.fright = false;
    g.abducted = g.hooked = 0;
    n++;
  }
  for (const c of crabs) if (!c.flung) { c.flung = 80; c.thrown = false; n++; }
  addScore(300 * n);
  flashTime = 40;
}

function updateStarfish() {
  if (starfish) {
    if (++starfish.t > 720) starfish = null;
  } else if (++starClock >= 1500) {
    starClock = 0;
    const [x, y] = randomTile(5);
    starfish = {x, y, t: 0};
  }
  if (!starfish || pac.mode !== 'normal') return;
  const pp = rpos(pac);
  if (Math.abs(pp.x - starfish.x) + Math.abs(pp.y - starfish.y) < 0.6) {
    starfish = null;
    nukeEnemies();
    toast('⭐ STARFISH POWER! Every enemy is wiped out', 150);
  }
}

function findTreasure() {
  treasure.found = true;
  nukeEnemies();
  addScore(1000);
  gfGlam = true;
  gfMad = 0;
  gfForgive = 1;
  say('Oh. My. God. Is that for ME?! 💎', 200);
  toast('💰 TREASURE! Enemies wiped out and your girlfriend is glowing', 200);
}

const FEED_LINES = ['Mmm, stingray sashimi! 😋', 'Ooh, another one? Okay…', 'I’m getting kinda full…', 'Babe, I can’t feel my legs 😩', 'STOP FEEDING ME 🐡', 'I can barely paddle…'];
// Cast a line at the nearest stingray, reel it in, and feed it to her.
function castLine() {
  if (state !== 'play' || paused || pac.mode !== 'normal' || pac.fishCool > 0) return;
  const pp = rpos(pac);
  let pick = null, pickDist = 5.5 ** 2;
  for (const g of ghosts) {
    if (g.state !== 'active' || g.abducted || g.hooked) continue;
    const gp = rpos(g), d = (gp.x - pp.x) ** 2 + (gp.y - pp.y) ** 2;
    if (d < pickDist) { pickDist = d; pick = g; }
  }
  if (!pick) { toast('🎣 Nothing biting. Get closer to a stingray', 70); pac.fishCool = 30; return; }
  pick.hooked = HOOK_TIME;
  pac.fishCool = 240;
  const gp = rpos(pick);
  popups.push({x: gp.x, y: gp.y, text: '🎣 HOOKED!', t: 50});
}

function feedGirlfriend() {
  gfFat = Math.min(5, gfFat + 1);
  addScore(300);
  gfMad = 0;
  gfForgive = 1;
  say(FEED_LINES[Math.min(FEED_LINES.length - 1, gfFat - 1)], 170);
}

function eatDot(x, y) {
  const d = dots[y][x];
  if (!d) return;
  dots[y][x] = '';
  dotsLeft--;
  addScore((d === 'o' ? 50 : 10) * (discoTime > 0 ? 2 : 1));
  if (d === 'o') frighten();
  if (!dotsLeft) { state = 'clear'; timer = 150; }
}

// Move an entity toward the next tile; onArrive runs each time it reaches a tile center.
function advance(e, speed, onArrive) {
  if (!e.dir.x && !e.dir.y) return;
  e.p += speed;
  while (e.p >= 1) {
    e.p -= 1;
    e.x = (e.x + e.dir.x + W) % W;
    e.y += e.dir.y;
    onArrive(e);
    if (!e.dir.x && !e.dir.y) { e.p = 0; return; }
  }
}

// Turn around mid-tile: target the tile we came from.
function reverse(e) {
  if (!e.dir.x && !e.dir.y) return;
  e.x = (e.x + e.dir.x + W) % W;
  e.y += e.dir.y;
  e.p = 1 - e.p;
  e.dir = {x: -e.dir.x, y: -e.dir.y};
}

function pacSpeed() {
  let s = Math.min(0.13, 0.1 + 0.004 * (level - 1));
  if (beerTime > 0) s *= 1.35;
  if (jointTime > 0) s *= 0.7;
  if (pac.surge > 0) s *= 1.6;
  if (pac.mode === 'dive') s *= 0.9;
  return s * (1 + 0.12 * Math.sin(frame * 0.045 + pac.y * 0.7)); // the swell surges and stalls you
}

const inPen = (x, y) => y >= 8 && y <= 10 && x >= 7 && x <= 11;
// Underwater you can pass beneath inner walls, but not the outer wall or the stingray pen.
function openDive(x, y, d) {
  const nx = (x + d.x + W) % W, ny = y + d.y;
  if (ny < 0 || ny >= H || (!d.x && !d.y)) return false;
  const c = MAP[ny][nx];
  if (c === '-' || inPen(nx, ny)) return false;
  return c !== '#' || (nx > 0 && nx < W - 1 && ny > 0 && ny < H - 1);
}
// Out of air under a wall: head for the nearest open water.
function escapeDir(x, y) {
  if (openDive(x, y, pac.face) && MAP[y + pac.face.y][(x + pac.face.x + W) % W] !== '#') return pac.face;
  const seen = new Set([`${x},${y}`]);
  const q = DIRS.filter(d => openDive(x, y, d)).map(d => ({x: (x + d.x + W) % W, y: y + d.y, first: d}));
  while (q.length) {
    const n = q.shift(), key = `${n.x},${n.y}`;
    if (seen.has(key)) continue;
    seen.add(key);
    if (MAP[n.y][n.x] !== '#') return n.first;
    for (const d of DIRS) if (openDive(n.x, n.y, d)) q.push({x: (n.x + d.x + W) % W, y: n.y + d.y, first: n.first});
  }
  return NONE;
}

function surface() {
  pac.mode = 'normal';
  pac.diveCool = DIVE_COOLDOWN;
}

function updateSurf() {
  if (pac.air > 0 && --pac.air === 0) {
    pac.combo++;
    const pts = 150 * pac.combo;
    addScore(pts);
    popups.push({x: pac.sx, y: wave ? wave.row : pac.y, text: `${TRICKS[pac.trick]}${pac.combo > 1 ? ` x${pac.combo}` : ''} +${pts}`, t: 60});
  }
  if (!wave || wave.row >= H - 2) { landSurf(); return; }
  pac.sx = Math.min(W - 2, Math.max(1, pac.sx + pac.drift * 0.09));
  const col = Math.round(pac.sx);
  for (let r = Math.floor(pac.lastRow) + 1; r <= Math.floor(wave.row); r++) {
    if (r >= 0 && r < H) eatDot(col, r);
  }
  pac.lastRow = wave.row;
  pac.x = col;
  pac.y = Math.min(H - 1, Math.max(0, Math.round(wave.row)));
  pac.p = 0;
  pac.dir = NONE;
  pac.face = DOWN;
}

function updatePac() {
  if (pac.mode === 'surf') { updateSurf(); return; }
  if (pac.stun > 0) { pac.stun--; return; }
  const diving = pac.mode === 'dive';
  const can = diving ? openDive : open;
  if (diving) {
    pac.dive--;
    if (pac.dive <= 0 && pac.p === 0 && MAP[pac.y][pac.x] !== '#') surface();
    else if (pac.dive <= 0 && !pac.dir.x && !pac.dir.y) pac.dir = escapeDir(pac.x, pac.y);
  }
  if (pac.surge > 0 && pac.mode === 'normal') {
    pac.surge--;
    if (pac.dir.y === -1) reverse(pac);
    else if (!pac.dir.x && !pac.dir.y && open(pac.x, pac.y, DOWN)) pac.dir = DOWN;
  } else if (!pac.dir.x && !pac.dir.y) {
    if (can(pac.x, pac.y, queued)) pac.dir = queued;
  } else if (opposite(queued, pac.dir) && !(diving && pac.dive <= 0)) {
    reverse(pac);
  }
  if (pac.dir.x || pac.dir.y) pac.face = pac.dir;
  advance(pac, pacSpeed(), pacArrive);
}

function pacArrive() {
  if (pac.mode === 'dive') {
    if (treasure && !treasure.found && pac.x === treasure.x && pac.y === treasure.y) findTreasure();
    const underWall = MAP[pac.y][pac.x] === '#';
    if (pac.dive > 0 || underWall) {
      if (pac.dive <= 0) pac.dir = escapeDir(pac.x, pac.y);
      else if (openDive(pac.x, pac.y, queued)) pac.dir = queued;
      else if (!openDive(pac.x, pac.y, pac.dir)) pac.dir = underWall ? escapeDir(pac.x, pac.y) : NONE;
      return;
    }
    surface();
  }
  eatDot(pac.x, pac.y);
  if (pac.surge > 0) {
    // The wave carries you south until something solid stops you.
    if (open(pac.x, pac.y, DOWN)) pac.dir = DOWN;
    else { pac.dir = NONE; pac.surge = 0; pac.stun = 20; }
    return;
  }
  if (open(pac.x, pac.y, queued)) pac.dir = queued;
  else if (!open(pac.x, pac.y, pac.dir)) pac.dir = NONE;
}

function frighten() {
  frightTime = Math.max(4, 9 - level) * 60;
  combo = 0;
  for (const g of ghosts) {
    if (g.state === 'active') { g.fright = true; reverse(g); }
  }
}

function target(g) {
  if (g.state === 'eaten') return HOME;
  if (g.state === 'leaving') return EXIT;
  if (modeIndex % 2 === 0) return g.corner;
  const d = pac.face;
  switch (g.name) {
    case 'pinky': return {x: pac.x + 4 * d.x, y: pac.y + 4 * d.y};
    case 'inky': {
      const b = ghosts[0];
      return {x: 2 * (pac.x + 2 * d.x) - b.x, y: 2 * (pac.y + 2 * d.y) - b.y};
    }
    default: return pac;
  }
}

function chooseDir(g) {
  const doorOK = g.state === 'leaving' || g.state === 'eaten';
  const opts = DIRS.filter(d => !opposite(d, g.dir) && open(g.x, g.y, d, doorOK));
  if (!opts.length) return {x: -g.dir.x, y: -g.dir.y};
  if (g.fright || (beerTime > 0 && Math.random() < 0.5)) return opts[Math.floor(Math.random() * opts.length)];
  const t = target(g);
  let pick = opts[0], pickDist = Infinity;
  for (const d of opts) {
    const dist = (g.x + d.x - t.x) ** 2 + (g.y + d.y - t.y) ** 2;
    if (dist < pickDist) { pickDist = dist; pick = d; }
  }
  return pick;
}

function ghostArrive(g) {
  if (g.state === 'leaving' && g.x === EXIT.x && g.y === EXIT.y) {
    g.state = 'active';
  } else if (g.state === 'eaten' && g.x === HOME.x && g.y === HOME.y) {
    g.state = 'leaving';
    g.dir = NONE;
  }
  g.dir = chooseDir(g);
}

function ghostSpeed(g) {
  let s;
  if (g.state === 'eaten') s = 0.22;
  else if (g.state === 'leaving') s = 0.07;
  else if (g.fright || (g.y === 9 && (g.x <= 4 || g.x >= 14))) s = 0.05;
  else s = Math.min(0.105, 0.075 + 0.004 * (level - 1));
  return s * timeScale();
}

function updateGhost(g) {
  if (g.hooked > 0) {
    if (--g.hooked === 0) { g.state = 'eaten'; g.fright = false; feedGirlfriend(); }
    return;
  }
  if (g.abducted > 0) {
    if (--g.abducted === 0) { g.state = 'eaten'; g.fright = false; }
    return;
  }
  if (g.state === 'house') {
    if (roundTime < g.release * 60) return;
    g.state = 'leaving';
  }
  advance(g, ghostSpeed(g), ghostArrive);
}

function crabArrive(c) {
  const opts = DIRS.filter(d => !opposite(d, c.dir) && open(c.x, c.y, d));
  c.dir = opts.length ? opts[Math.floor(Math.random() * opts.length)] : {x: -c.dir.x, y: -c.dir.y};
}

function updateCrab(c) {
  if (c.flung > 0) {
    if (--c.flung === 0) {
      [c.x, c.y] = randomTile(6);
      c.thrown = false;
      c.dir = NONE;
      c.p = 0;
    }
    return;
  }
  if (!c.dir.x && !c.dir.y) crabArrive(c);
  advance(c, 0.03 * timeScale(), crabArrive);
}

function checkCollisions() {
  if (pac.mode !== 'normal' || pac.rayBlind > 0) return;
  const pp = rpos(pac);
  for (const g of ghosts) {
    if (g.state !== 'active' || g.abducted || g.hooked) continue;
    const gp = rpos(g);
    if ((pp.x - gp.x) ** 2 + (pp.y - gp.y) ** 2 > 0.4) continue;
    if (g.fright) {
      g.fright = false;
      g.state = 'eaten';
      combo++;
      const pts = 200 * 2 ** (combo - 1);
      addScore(pts);
      popups.push({x: gp.x, y: gp.y, text: pts, t: 60});
      freeze = 30;
    } else {
      state = 'dying';
      timer = 90;
      return;
    }
  }
}

function checkCrabs() {
  if (pac.mode !== 'normal') return;
  const pp = rpos(pac);
  for (const c of crabs) {
    if (c.flung) continue;
    const cp = rpos(c);
    if ((pp.x - cp.x) ** 2 + (pp.y - cp.y) ** 2 > 0.45) continue;
    if (beerTime > 0) {
      c.flung = 80;
      c.thrown = false;
      addScore(100);
      popups.push({x: cp.x, y: cp.y, text: 'YEET +100', t: 60});
    } else if (pac.crabSafe === 0) {
      pac.stun = 45;
      pac.crabSafe = 120;
      popups.push({x: cp.x, y: cp.y, text: 'PINCHED!', t: 60});
    }
  }
}

function updateItems() {
  items.forEach(it => it.t++);
  items = items.filter(it => it.t < 900);
  if (++itemClock >= 540 && items.length < 2) {
    itemClock = 0;
    const [x, y] = randomTile(4);
    if (!items.some(it => it.x === x && it.y === y)) items.push({type: Math.random() < 0.55 ? 'beer' : 'joint', x, y, t: 0});
  }
  if (pac.mode !== 'normal') return;
  const pp = rpos(pac);
  items = items.filter(it => {
    if (Math.abs(pp.x - it.x) + Math.abs(pp.y - it.y) > 0.6) return true;
    inv[it.type]++;
    addScore(100);
    popups.push({x: it.x, y: it.y, text: it.type === 'beer' ? '+1 🍺' : '+1 🌿', t: 60});
    return false;
  });
}

function updateWaves(ts) {
  if (!wave) {
    const every = dest().waveEvery * 60;
    waveClock += ts;
    if (waveClock >= every - 180 && !waveWarned) { waveWarned = true; toast('🌊 Wave coming! Press F to surf it'); }
    if (waveClock >= every) { wave = {row: -5}; waveClock = 0; waveWarned = false; }
    return;
  }
  const prev = wave.row;
  wave.row += (pac.mode === 'surf' ? 0.075 : 0.11) * ts;
  const py = rpos(pac).y;
  if (pac.mode === 'normal' && pac.wantsSurf && prev < py - 0.3 && wave.row >= py - 0.3) startSurf();
  else if (pac.mode === 'normal' && prev < py && wave.row >= py) pac.surge = 34;
  for (const c of crabs) {
    const cy = rpos(c).y;
    if (!c.flung && prev < cy && wave.row >= cy) { c.flung = 80; c.thrown = true; }
  }
  if (wave.row > H + 5 && pac.mode !== 'surf') wave = null;
}

// Random chaos: a disco party, a breaching whale that kicks up a wave, or a UFO.
function triggerEvent(forced) {
  const options = ['disco', 'whale', 'ufo'].filter(e => e !== lastEvent && !(e === 'whale' && wave) && !(e === 'ufo' && !ghosts.some(g => g.state === 'active' && !g.abducted)));
  if (!options.length && !forced) return;
  const e = forced || options[Math.floor(Math.random() * options.length)];
  lastEvent = e;
  if (e === 'disco') {
    discoTime = 480;
    toast('🪩 DISCO PARTY! Pearls are worth double');
  } else if (e === 'whale') {
    whale = {t: 0, side: Math.random() < 0.5 ? -1 : 1};
    waveWarned = true;
    toast('🐋 WHALE BREACH! Big wave coming, press F to catch it');
  } else {
    const pp = rpos(pac);
    const targets = ghosts.filter(g => g.state === 'active' && !g.abducted);
    const g = targets.reduce((a, b) => ((rpos(a).x - pp.x) ** 2 + (rpos(a).y - pp.y) ** 2 < (rpos(b).x - pp.x) ** 2 + (rpos(b).y - pp.y) ** 2 ? a : b));
    g.abducted = 270;
    ufo = {t: 0, g: ghosts.indexOf(g)};
    toast('🛸 Alien abduction! They took a stingray');
  }
}

function updateEvents() {
  if (discoTime > 0) discoTime--;
  if (whale && ++whale.t === 60) waveClock = dest().waveEvery * 60;
  if (whale && whale.t > 150) whale = null;
  if (ufo && ++ufo.t > 390) ufo = null;
  if (++eventClock >= nextEventAt) {
    eventClock = 0;
    nextEventAt = 2400 + Math.random() * 900;
    triggerEvent();
  }
}

function updateGfMood() {
  if (speechTime > 0) speechTime--;
  if (gfMad > 0) {
    if (--gfMad === 0) { say('Fine… I forgive you 💕', 140); gfForgive = 1; }
    else if (gfMad % 240 === 0) say(MAD_LINES[Math.floor(Math.random() * MAD_LINES.length)]);
  }
}

function step() {
  frame++;
  popups.forEach(p => p.t--);
  popups = popups.filter(p => p.t > 0);
  if (toastTime > 0) toastTime--;
  if (flashTime > 0) flashTime--;
  if (state === 'ready') { if (--timer <= 0) state = 'play'; return; }
  if (state === 'dying') {
    if (--timer > 0) return;
    if (--lives <= 0) state = 'over';
    else { resetPositions(); state = 'ready'; timer = 90; }
    return;
  }
  if (state === 'clear') { if (--timer <= 0) { level++; state = 'travel'; timer = 210; } return; }
  if (state === 'travel') {
    if (--timer === 105) { applyDestination(); loadDots(); resetPositions(); gfFat = Math.max(0, gfFat - 1); }
    if (timer <= 0) { state = 'ready'; timer = 120; }
    return;
  }
  if (state !== 'play' || paused) return;
  if (freeze > 0) { freeze--; return; }

  const ts = timeScale();
  roundTime += ts;
  if (beerTime > 0) beerTime--;
  if (jointTime > 0) jointTime--;
  if (redEyes > 0) redEyes--;
  if (pac.crabSafe > 0) pac.crabSafe--;
  if (pac.rayBlind > 0) pac.rayBlind--;
  if (pac.diveCool > 0) pac.diveCool--;
  if (pac.fishCool > 0) pac.fishCool--;
  if (frightTime > 0) {
    if (--frightTime === 0) ghosts.forEach(g => { g.fright = false; });
  } else if (++modeTime >= MODES[modeIndex] * 60) {
    modeIndex++;
    modeTime = 0;
    ghosts.forEach(g => { if (g.state === 'active') reverse(g); });
  }

  if (beerTime > 0 && pac.mode === 'normal' && Math.random() < 0.006) queued = DIRS[Math.floor(Math.random() * 4)]; // drunk swerve
  updateEvents();
  updateGfMood();
  updateWaves(ts);
  updatePac();
  if (state !== 'play') return;
  updateItems();
  updateStarfish();
  checkCollisions();
  if (state !== 'play') return;
  ghosts.forEach(updateGhost);
  crabs.forEach(updateCrab);
  checkCollisions();
  checkCrabs();
}

// Tileable ocean normal map built from a sum of integer-frequency waves.
function makeWaterNormals() {
  const N = 256, canvas = document.createElement('canvas');
  canvas.width = canvas.height = N;
  const g = canvas.getContext('2d'), img = g.createImageData(N, N);
  const waves = [];
  while (waves.length < 48) {
    const a = Math.random() * Math.PI * 2, f = 1 + Math.random() * Math.random() * 22;
    const kx = Math.round(Math.cos(a) * f), ky = Math.round(Math.sin(a) * f);
    if (kx || ky) waves.push({kx, ky, amp: 1 / (Math.hypot(kx, ky) + 1.5), ph: Math.random() * Math.PI * 2});
  }
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let dx = 0, dy = 0;
      for (const w of waves) {
        const c = Math.cos(2 * Math.PI * (w.kx * x + w.ky * y) / N + w.ph) * w.amp;
        dx += c * w.kx;
        dy += c * w.ky;
      }
      const n = new THREE.Vector3(-dx * 0.22, -dy * 0.22, 1).normalize();
      const i = (y * N + x) * 4;
      img.data[i] = (n.x * 0.5 + 0.5) * 255;
      img.data[i + 1] = (n.y * 0.5 + 0.5) * 255;
      img.data[i + 2] = (n.z * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function valueNoise(cells) {
  const grid = Array.from({length: cells * cells}, Math.random);
  const at = (x, y) => grid[((y % cells) + cells) % cells * cells + ((x % cells) + cells) % cells];
  return (u, v) => {
    const fx = u * cells, fy = v * cells, x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const a = at(x0, y0) + (at(x0 + 1, y0) - at(x0, y0)) * sx;
    const b = at(x0, y0 + 1) + (at(x0 + 1, y0 + 1) - at(x0, y0 + 1)) * sx;
    return a + (b - a) * sy;
  };
}

function makeStoneTextures() {
  const N = 512;
  const layers = [4, 8, 16, 32, 64, 128].map(valueNoise);
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = N; return c; };
  const colorC = mk(), roughC = mk(), bumpC = mk();
  const ci = colorC.getContext('2d').createImageData(N, N);
  const ri = roughC.getContext('2d').createImageData(N, N);
  const bi = bumpC.getContext('2d').createImageData(N, N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let h = 0, amp = 0.5;
      for (const n of layers) { h += n(x / N, y / N) * amp; amp *= 0.5; }
      const grain = Math.random() * 0.08;
      const pit = h < 0.38 ? (0.38 - h) * 2.2 : 0;
      const t = Math.min(1, Math.max(0, h * 1.2 - 0.1 + grain - pit));
      const i = (y * N + x) * 4;
      ci.data[i] = 98 + t * 112;
      ci.data[i + 1] = 84 + t * 88;
      ci.data[i + 2] = 64 + t * 56;
      ri.data[i] = ri.data[i + 1] = ri.data[i + 2] = 150 + (1 - t) * 90;
      bi.data[i] = bi.data[i + 1] = bi.data[i + 2] = (h - pit * 0.6 + grain * 0.5) * 255;
      ci.data[i + 3] = ri.data[i + 3] = bi.data[i + 3] = 255;
    }
  }
  colorC.getContext('2d').putImageData(ci, 0, 0);
  roughC.getContext('2d').putImageData(ri, 0, 0);
  bumpC.getContext('2d').putImageData(bi, 0, 0);
  const map = new THREE.CanvasTexture(colorC);
  map.colorSpace = THREE.SRGBColorSpace;
  const out = {map, roughnessMap: new THREE.CanvasTexture(roughC), bumpMap: new THREE.CanvasTexture(bumpC)};
  for (const t of Object.values(out)) t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return out;
}

let walls, trimMesh, dotMesh, powerMesh, dotTiles = [], powerTiles = [];

function buildMaze() {
  for (const m of [walls, trimMesh, dotMesh, powerMesh]) if (m) { scene.remove(m); m.dispose(); }
  const wallTiles = [];
  dotTiles = [];
  powerTiles = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (MAP[y][x] === '#') wallTiles.push([x, y]);
      if (MAP[y][x] === '.') dotTiles.push([x, y]);
      if (MAP[y][x] === 'o') powerTiles.push([x, y]);
    }
  }

  walls = new THREE.InstancedMesh(wallGeo, wallMat, wallTiles.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1);
  wallTiles.forEach(([x, y], i) => {
    q.setFromEuler(e.set(0, (Math.random() - 0.5) * 0.01, 0));
    m.compose(new THREE.Vector3(wx(x), WALL_TOP - WALL_H / 2 + (Math.random() - 0.5) * 0.03, wz(y)), q, one);
    walls.setMatrixAt(i, m);
  });
  walls.castShadow = walls.receiveShadow = true;

  // Neon trim along every top edge that faces open water.
  const trims = [], inset = 0.14;
  for (const [x, y] of wallTiles) {
    for (const n of DIRS) {
      if (isWall(x + n.x, y + n.y)) continue;
      const t = {x: n.y, y: n.x}; // tangent along the edge
      const ends = [-1, 1].map(s => {
        const ax = x + s * t.x, ay = y + s * t.y;
        if (!isWall(ax, ay)) return s * (S / 2 - inset);
        if (isWall(ax + n.x, ay + n.y)) return s * (S / 2 + inset);
        return s * S / 2;
      });
      const mid = (ends[0] + ends[1]) / 2, len = ends[1] - ends[0];
      trims.push(m.clone().compose(
        new THREE.Vector3(wx(x) + n.x * (S / 2 - inset) + t.x * mid, WALL_TOP + 0.01, wz(y) + n.y * (S / 2 - inset) + t.y * mid),
        new THREE.Quaternion(),
        new THREE.Vector3(t.x ? len : 0.09, 0.07, t.y ? len : 0.09)));
    }
  }
  trimMesh = new THREE.InstancedMesh(trimGeo, trimMat, trims.length);
  trims.forEach((t, i) => trimMesh.setMatrixAt(i, t));

  dotMesh = new THREE.InstancedMesh(pearlGeo, pearlMat, dotTiles.length);
  powerMesh = new THREE.InstancedMesh(bigPearlGeo, bigPearlMat, powerTiles.length);
  dotMesh.frustumCulled = powerMesh.frustumCulled = false;
  scene.add(walls, trimMesh, dotMesh, powerMesh);
}

function applyDestination() {
  const d = dest();
  MAP = MAPS[d.map];
  sun.setFromSphericalCoords(1, deg(90 - d.elevation), deg(d.azimuth));
  su.turbidity.value = d.turbidity;
  su.rayleigh.value = d.rayleigh;
  su.sunPosition.value.copy(sun);
  if (envRT) envRT.dispose();
  envScene.add(sky);
  envRT = pmrem.fromScene(envScene);
  scene.environment = envRT.texture;
  scene.add(sky);
  water.material.uniforms.sunDirection.value.copy(sun).normalize();
  water.material.uniforms.waterColor.value.set(d.water);
  waveMat.color.set(d.water).offsetHSL(0, 0.05, 0.05);
  sunLight.position.copy(sun).multiplyScalar(80);
  sunLight.color.set(d.sun);
  renderer.toneMappingExposure = d.exposure;
  waveMesh.scale.y = d.waveHeight;
  if (d.beach && !beach) beach = buildBeach();
  if (beach) beach.visible = !!d.beach;
  buildMaze();
}

// ---------------------------------------------------------------- sunset beach with palm trees
const MAZE_HX = W * S / 2 + 0.5, MAZE_HZ = H * S / 2 + 0.5;
let beach = null;
const palmCrowns = [];

function makeSandHeight() {
  const dunes = valueNoise(10), ripples = valueNoise(40);
  return (x, z) => {
    if (Math.abs(x) < MAZE_HX && Math.abs(z) < MAZE_HZ) return -1;
    const d = Math.hypot(Math.max(Math.abs(x) - MAZE_HX, 0), Math.max(Math.abs(z) - MAZE_HZ, 0));
    const u = (x + 100) / 200, v = (z + 100) / 200;
    let h = -0.7 + Math.min(d, 7) / 7 * 1.5 + THREE.MathUtils.smoothstep(d, 5, 10) * (dunes(u, v) * 0.9 + ripples(u, v) * 0.15);
    h -= Math.max(0, d - 15) * 0.3;
    // Keep a channel open so the tunnel still leads out to sea.
    const ch = Math.abs(z - wz(9));
    if (Math.abs(x) > MAZE_HX && ch < 3) h = Math.min(h, -0.7 + THREE.MathUtils.smoothstep(ch, 1.4, 3) * (h + 0.7));
    return h;
  };
}

function makeGrainTexture(base, spread, w, h, stripes) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const band = stripes ? (x % stripes < 3 ? -40 : 0) : 0;
      const v = base + (Math.random() - 0.5) * spread + band, i = (y * w + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const barkMat = new THREE.MeshStandardMaterial({color: 0xb08a66, roughness: 0.95, map: makeGrainTexture(200, 70, 256, 32, 16)});
barkMat.map.repeat.set(3, 1);
const frondMats = [0x3d7a2a, 0x4a8a30, 0x356b24].map(c => new THREE.MeshStandardMaterial({color: c, roughness: 0.75, side: THREE.DoubleSide}));
const coconutMat = new THREE.MeshStandardMaterial({color: 0x5a3b1c, roughness: 0.7});
const frondGeo = (() => {
  const L = 2.8, geo = new THREE.PlaneGeometry(L, 0.8, 16, 4).translate(L / 2, 0, 0).rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const t = pos.getX(i) / L, z = pos.getZ(i) * Math.pow(Math.sin(Math.PI * Math.min(1, t * 0.95 + 0.05)), 0.7);
    pos.setZ(i, z);
    pos.setY(i, 0.6 * t - 1.5 * t * t - Math.abs(z) * 0.5); // arch up, droop, fold along the midrib
  }
  geo.computeVertexNormals();
  return geo;
})();

function makePalm(height, lean) {
  const g = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(lean * 0.15, height * 0.35, 0),
    new THREE.Vector3(lean * 0.55, height * 0.7, 0), new THREE.Vector3(lean, height, 0)]);
  const TS = 20, RS = 10, tube = new THREE.TubeGeometry(curve, TS, 0.2, RS);
  const pos = tube.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i <= TS; i++) {
    const c = curve.getPointAt(i / TS), k = 1 - 0.45 * i / TS; // taper toward the crown
    for (let j = 0; j <= RS; j++) {
      v.fromBufferAttribute(pos, i * (RS + 1) + j).sub(c).multiplyScalar(k).add(c);
      pos.setXYZ(i * (RS + 1) + j, v.x, v.y, v.z);
    }
  }
  tube.computeVertexNormals();
  g.add(new THREE.Mesh(tube, barkMat));
  const crown = new THREE.Group();
  crown.position.copy(curve.getPointAt(1));
  crown.scale.setScalar(0.9 + height * 0.08);
  const n = 9;
  for (let k = 0; k < n; k++) {
    const frond = new THREE.Mesh(frondGeo, frondMats[k % 3]);
    frond.rotation.set(0, k * Math.PI * 2 / n + Math.random() * 0.3, 0.2 + Math.random() * 0.4);
    crown.add(frond);
  }
  for (let k = 0; k < 3; k++) {
    const nut = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), coconutMat);
    nut.position.set(Math.cos(k * 2.1) * 0.18, -0.2, Math.sin(k * 2.1) * 0.18);
    crown.add(nut);
  }
  crown.userData.phase = Math.random() * 10;
  palmCrowns.push(crown);
  g.add(crown);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function buildBeach() {
  const group = new THREE.Group(), height = makeSandHeight();
  const geo = new THREE.PlaneGeometry(120, 120, 240, 240).rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, colors = new Float32Array(pos.count * 3);
  const wet = new THREE.Color(0x9a6c45), dry = new THREE.Color(0xf6c98e), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const h = height(pos.getX(i), pos.getZ(i));
    pos.setY(i, h);
    c.lerpColors(wet, dry, THREE.MathUtils.smoothstep(h, 0.02, 0.45));
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const sandMap = makeGrainTexture(225, 50, 256, 256);
  sandMap.repeat.set(40, 40);
  const sand = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors: true, map: sandMap, roughness: 1}));
  sand.receiveShadow = true;
  group.add(sand);

  const spots = [];
  for (let tries = 0; spots.length < 22 && tries < 3000; tries++) {
    const x = (Math.random() - 0.5) * 84, z = (Math.random() - 0.5) * 88, h = height(x, z);
    if (h < 0.45 || spots.some(([sx, sz]) => (sx - x) ** 2 + (sz - z) ** 2 < 16)) continue;
    spots.push([x, z]);
    const palm = makePalm(4 + Math.random() * 3.5, 0.6 + Math.random() * 1.6);
    palm.position.set(x, h - 0.05, z);
    palm.rotation.y = Math.atan2(z, -x) + (Math.random() - 0.5) * 1.2; // lean out toward the water
    group.add(palm);
  }
  scene.add(group);
  return group;
}

const WAVE_SPAN = W * S + 16;

const waveProfile = dz => Math.exp(-((dz / (dz > 0 ? 1.2 : 2.6)) ** 2)); // steep face toward the south
{

    pos.setY(i, waveProfile(pos.getZ(i)) * taper * (0.88 + 0.12 * Math.sin(x * 0.45)));
  }
  waveGeo.computeVertexNormals();
}

function makeSurfer({color, board, stripe, girl}) {
  const group = new THREE.Group(), rider = new THREE.Group(), body = new THREE.Group();
  group.add(rider);
  const boardMat = new THREE.MeshPhysicalMaterial({color: board, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08});
  const deck = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 20), boardMat);
  deck.scale.set(0.5, 0.08, 1.25);
  const stripeMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 20), new THREE.MeshPhysicalMaterial({color: stripe, roughness: 0.3, clearcoat: 1}));
  stripeMesh.scale.set(0.08, 0.087, 1.19);
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.22, 0.22), boardMat);
  fin.position.set(0, -0.12, -0.95);
  rider.add(deck, stripeMesh, fin);

  const R = girl ? 0.58 : 0.64;
  const mat = girl
    ? new THREE.MeshPhysicalMaterial({color, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08, sheen: 0.6, sheenColor: new THREE.Color(0xffb0c8)})
    : new THREE.MeshPhysicalMaterial({color, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.2});
  const mouthMat = new THREE.MeshStandardMaterial({color: 0x4a0a10, roughness: 0.7});
  const upper = new THREE.Group(), lower = new THREE.Group();
  upper.add(new THREE.Mesh(new THREE.SphereGeometry(R, 56, 28, 0, Math.PI * 2, 0, Math.PI / 2), mat));
  lower.add(new THREE.Mesh(new THREE.SphereGeometry(R, 56, 28, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat));
  const capGeo = new THREE.CircleGeometry(R * 0.995, 56);
  const upperCap = new THREE.Mesh(capGeo, mouthMat);
  upperCap.rotation.x = Math.PI / 2;
  const lowerCap = new THREE.Mesh(capGeo, mouthMat);
  lowerCap.rotation.x = -Math.PI / 2;
  upper.add(upperCap);
  lower.add(lowerCap);

  const eyeMat = new THREE.MeshPhysicalMaterial({color: 0xffffff, roughness: 0.12, clearcoat: 1});
  const pupilMat = new THREE.MeshPhysicalMaterial({color: girl ? 0x1b78e0 : 0x111111, roughness: 0.1, clearcoat: 1});
  const darkMat = new THREE.MeshPhysicalMaterial({color: 0x111111, roughness: 0.1, clearcoat: 1});
  const eyes = [], lids = [], brows = [], glam = [];
  for (const sx of [-1, 1]) {
    const eye = new THREE.Group();
    eye.position.set(sx * 0.34, 0.72, 0.52).normalize().multiplyScalar(R * 0.86);
    eye.rotation.x = -0.6; // tilt the eyes up toward the camera
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), eyeMat);
    white.scale.set(1, 1.15, 0.8);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(girl ? 0.11 : 0.1, 18, 12), pupilMat);
    pupil.position.set(-sx * 0.015, -0.01, 0.135);
    eye.add(white, pupil);
    if (girl) {
      const center = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), darkMat);
      center.position.set(-sx * 0.015, -0.01, 0.2);
      const glint = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), eyeMat);
      glint.position.set(-sx * 0.045, 0.035, 0.23);
      eye.add(center, glint);
    }
    // Heavy lids that droop over the eyes when he's high.
    const lid = new THREE.Mesh(new THREE.SphereGeometry(0.215, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat);
    lid.scale.copy(white.scale);
    lid.rotation.x = -0.2;
    lid.visible = false;
    eye.add(lid);
    eyes.push(eye);
    lids.push(lid);
    upper.add(eye);
  }

  if (girl) {
    const red = new THREE.MeshPhysicalMaterial({color: 0xe0102f, roughness: 0.3, clearcoat: 1});
    const bow = new THREE.Group();
    for (const s of [-1, 1]) {
      const loop = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 24), red);
      loop.rotation.z = s * Math.PI / 2;
      loop.position.x = s * 0.15;
      bow.add(loop);
    }
    bow.add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), red));
    bow.position.set(-0.22, R * 0.9, 0.1);
    bow.rotation.set(0.3, 0.4, 0.35);
    upper.add(bow);
    // Full, glossy lips.
    const lipMat = new THREE.MeshPhysicalMaterial({color: 0xd4002a, roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.02});
    for (const [grp, y, k] of [[upper, -0.035, 1], [lower, 0.035, 1.15]]) {
      const lip = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 14), lipMat);
      lip.scale.set(0.24 * k, 0.075 * k, 0.09);
      lip.position.set(0, y, R * 0.95);
      grp.add(lip);
    }
    const blushMat = new THREE.MeshStandardMaterial({color: 0xff6f9f, transparent: true, opacity: 0.55, roughness: 0.6});
    for (const sx of [-1, 1]) {
      const blush = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 10), blushMat);
      blush.scale.set(1, 0.6, 0.25);
      blush.position.set(sx * 0.62, 0.12, 0.62).normalize().multiplyScalar(R * 0.985);
      blush.lookAt(0, 0, 0);
      upper.add(blush);
    }
    const mole = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 8), darkMat);
    mole.position.set(0.5, 0.1, 0.62).normalize().multiplyScalar(R * 0.99);
    upper.add(mole);
    // Long, curled lashes.
    for (const eye of eyes) {
      for (const a of [-0.7, -0.25, 0.25, 0.7]) {
        const lash = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.17, 0.022), darkMat);
        lash.position.copy(eye.position).add(new THREE.Vector3(a * 0.16, 0.12, -0.14));
        lash.rotation.set(-0.5, 0, -a * 0.9);
        upper.add(lash);
      }
    }
    // Angry brows for when she's mad at him.
    eyes.forEach((eye, i) => {
      const sx = i === 0 ? -1 : 1;
      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.06, 0.06), darkMat);
      brow.position.copy(eye.position).add(new THREE.Vector3(0, 0.15, -0.06));
      brow.rotation.set(-0.6, 0, sx * 0.5);
      brow.visible = false;
      brows.push(brow);
      upper.add(brow);
    });
    // Treasure glam: a tiara and a pearl necklace.
    const tiaraGold = new THREE.MeshStandardMaterial({color: 0xffd34d, metalness: 1, roughness: 0.2, emissive: 0x664400, emissiveIntensity: 0.5});
    const tiara = new THREE.Group();
    tiara.add(new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.035, 8, 32, Math.PI), tiaraGold));
    [0x5ad1ff, 0xff4fa3, 0x5ad1ff].forEach((c, i) => {
      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.075), new THREE.MeshStandardMaterial({color: c, emissive: c, emissiveIntensity: 1.5, roughness: 0.1}));
      const a = Math.PI * (0.25 + i * 0.25);
      gem.position.set(Math.cos(a) * 0.32, Math.sin(a) * 0.32 + 0.05, 0);
      tiara.add(gem);
    });
    tiara.position.set(0, R * 0.78, 0.12);
    tiara.rotation.x = -0.35;
    upper.add(tiara);
    const necklace = new THREE.Group();
    const pearlWhite = new THREE.MeshPhysicalMaterial({color: 0xfffaf0, roughness: 0.15, clearcoat: 1, sheen: 1});
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * Math.PI * 2;
      const bead = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), pearlWhite);
      bead.position.set(Math.cos(a) * R * 0.92, -R * 0.42, Math.sin(a) * R * 0.92);
      necklace.add(bead);
    }
    lower.add(necklace);
    glam.push(tiara, necklace);
    glam.forEach(m => { m.visible = false; });
    // Pink heart sunglasses pushed up on her head.
    const lensMat = new THREE.MeshPhysicalMaterial({color: 0xff2d7a, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0.8});
    const goldMat = new THREE.MeshStandardMaterial({color: 0xe8c15a, metalness: 1, roughness: 0.25});
    const shades = new THREE.Group();
    for (const sx of [-1, 1]) {
      const lens = new THREE.Mesh(heartGeo, lensMat);
      lens.scale.setScalar(0.75);
      lens.position.x = sx * 0.2;
      shades.add(lens);
    }
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.025, 0.025), goldMat);
    bridge.position.y = 0.06;
    shades.add(bridge);
    shades.position.set(0.05, R * 0.78, -0.3);
    shades.rotation.x = -1.35;
    upper.add(shades);
    const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.014, 10, 32), goldMat);
    hoop.position.set(R * 0.97, -0.12, 0.05);
    hoop.rotation.y = Math.PI / 2;
    upper.add(hoop);
  }

  body.add(upper, lower);
  body.position.y = 0.08 + R * 0.92;
  rider.add(body);
  group.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(group);
  return {group, rider, body, upper, lower, eyes, eyeMat, lids, brows, glam, mat, baseColor: new THREE.Color(color), board: [deck, stripeMesh, fin], R, heading: Math.PI * 1.5, lean: 0};
}

// A joint Pac-Man holds in the corner of his mouth while it's lit.
const paperMat = new THREE.MeshStandardMaterial({color: 0xf2eee4, roughness: 0.9});
const emberMat = new THREE.MeshStandardMaterial({color: 0x331100, emissive: 0xff5a14, emissiveIntensity: 6});
function makeJoint() {
  const g = new THREE.Group();
  const paper = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.032, 0.62, 16), paperMat);
  paper.rotation.x = Math.PI / 2;
  const ember = new THREE.Mesh(new THREE.SphereGeometry(0.052, 12, 10), emberMat);

const RNU = 22, RNV = 14, RAY_LEN = 0.8, RAY_SPAN = 1.0;
const rayHalfWidth = v => RAY_SPAN * Math.pow(Math.max(0, 1 - Math.abs(v - 0.2) / 1.2), 0.85);
function makeRayGeometry() {
  const g = new THREE.BufferGeometry(), n = (RNU + 1) * (RNV + 1);
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const uv = new Float32Array(n * 2), idx = [];
  for (let j = 0; j <= RNV; j++) {
    for (let i = 0; i <= RNU; i++) {
      const k = j * (RNU + 1) + i;
      uv[k * 2] = i / RNU;
      uv[k * 2 + 1] = j / RNV;
    }
  }
  for (let j = 0; j < RNV; j++) {
    for (let i = 0; i < RNU; i++) {
      const a = j * (RNU + 1) + i, b = a + 1, c = a + RNU + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
// Body hump plus a travelling wave out along each wing.
function shapeRay(g, t, flap) {
  const pos = g.attributes.position;
  for (let j = 0; j <= RNV; j++) {
    const v = -1 + 2 * j / RNV, hw = rayHalfWidth(v), z = v * RAY_LEN;
    for (let i = 0; i <= RNU; i++) {
      const x = (-1 + 2 * i / RNU) * hw, ax = Math.abs(x);
      const y = 0.13 * Math.exp(-(x * x) / 0.05 - (z * z) / 0.3) + Math.sin(ax * 3.2 - t * 7) * 0.2 * Math.pow(ax / RAY_SPAN, 1.4) * flap;
      pos.setXYZ(j * (RNU + 1) + i, x, y, z);
    }
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
}

function spawn(pool, p, v, size, life, {color = WHITE, gravity = 0.008, grow = 0} = {}) {

function updatePool(pool) {
  for (const q of pool.list) {

    if (q.gravity > 0 && q.p.y <= 0.05) { q.p.y = 0.05; q.v.y = 0; q.v.multiplyScalar(0.9); }

    const age = 1 - q.life / q.max;
    const k = q.size * (q.grow ? 1 + age * q.grow : Math.sqrt(1 - age) * (0.6 + age));

}

// Shared surfing motion: heading, lean into turns, bob on the swell, chomp, wake.
function rideSurfer(v, heading, moving, dt, chompSpeed, wake = true) {
  const diff = angleDiff(v.heading, heading);
  const turn = diff * Math.min(1, dt * 12);
  v.heading += turn;
  v.group.rotation.y = v.heading;
  v.lean += (-turn * 9 - v.lean) * Math.min(1, dt * 8);
  const slope = (waveH(v.group.position.z + 0.3) - waveH(v.group.position.z - 0.3)) / 0.6;
  v.rider.position.y = 0.12 + Math.sin(time * 3.1 + v.R) * 0.05;
  v.rider.rotation.set(Math.sin(time * 2.3) * 0.05 - (moving ? 0.06 : 0) - slope * Math.cos(v.heading) * 0.5, 0, v.lean + Math.sin(time * 1.7) * 0.04 + slope * Math.sin(v.heading) * 0.5);
  const mouth = moving ? 0.08 + Math.abs(Math.sin(time * chompSpeed)) * 0.55 : 0.28;
  v.upper.rotation.x = -mouth;
  v.lower.rotation.x = mouth;
  if (moving && wake) {
    const fwd = new THREE.Vector3(Math.sin(v.heading), 0, Math.cos(v.heading));
    const side = new THREE.Vector3(fwd.z, 0, -fwd.x);
    const base = v.group.position;
    const boost = beerTime > 0 && v === pacV ? 2 : 1;
    for (const s of [-1, 1]) {
      for (let n = 0; n < boost; n++) {
        const p = base.clone().addScaledVector(fwd, -0.8).addScaledVector(side, s * 0.3);
        p.y = 0.08 + waveH(p.z);
        const vel = side.clone().multiplyScalar(s * (0.02 + Math.random() * 0.02 * boost)).addScaledVector(fwd, -0.01);
        vel.y = 0.02 + Math.random() * 0.03 * boost;
        spawn(foam, p, vel, 0.08 + Math.random() * 0.08, 50 + Math.random() * 40);
      }
    }
    if (Math.abs(turn) > 0.03) {
      const out = Math.sign(turn);
      for (let i = 0; i < 6; i++) {
        const p = base.clone().addScaledVector(side, -out * 0.4);
        p.y = 0.2 + waveH(p.z);
        const vel = side.clone().multiplyScalar(-out * (0.05 + Math.random() * 0.06)).addScaledVector(fwd, (Math.random() - 0.5) * 0.06);
        vel.y = 0.08 + Math.random() * 0.1;
        spawn(foam, p, vel, 0.06 + Math.random() * 0.07, 40 + Math.random() * 20);
      }
    }
  }
}

let pacDepth = 0;
function updatePacView(dt) {
  let px, py, pz;
  if (pac.mode === 'surf' && wave) {
    // Up on the face of the wave, just ahead of the crest.
    px = wx(pac.sx);
    pz = wz(wave.row) + 0.6;
    py = waveMesh.scale.y * waveProfile(0.6);
  } else {
    const {x, y} = rpos(pac);
    px = wx(x);
    pz = wz(y);
    py = waveH(pz);
  }
  pacDepth += ((pac.mode === 'dive' ? DIVE_DEPTH : 0) - pacDepth) * Math.min(1, dt * 5);
  pacV.group.position.set(px, py + pacDepth, pz);
  pacV.group.visible = state !== 'over';
  pacV.board.forEach(m => { m.visible = pacDepth > -0.5; });
  const moving = state === 'play' && !paused && freeze === 0 && pac.stun === 0 && (pac.mode === 'surf' || pac.dir.x || pac.dir.y);

  if (state === 'dying') {
    const k = 1 - timer / 90;
    pacV.rider.position.y = 0.12 - k * k * 1.6;
    pacV.rider.rotation.set(k * 1.2, 0, k * 5);
    pacV.upper.rotation.x = -k * 1.4;
    pacV.lower.rotation.x = k * 1.4;
    return;
  }
  rideSurfer(pacV, headingOf(pac.face), moving, dt, 18 * (jointTime > 0 ? 0.6 : 1), pac.mode === 'normal');
  if (pac.stun > 0) pacV.rider.rotation.z += Math.sin(frame * 0.9) * 0.35;
  if (discoTime > 0) pacV.rider.position.y += Math.abs(Math.sin(time * 8)) * 0.3;
  if (pac.mode === 'surf') {
    pacV.rider.rotation.z += -pac.drift * 0.4;
    pacV.rider.rotation.x += 0.25;
    if (pac.air > 0) {
      const k = 1 - pac.air / AIR_TIME;
      pacV.group.position.y += 2.6 * Math.sin(Math.PI * k);
      if (pac.trick === 'spin') pacV.rider.rotation.y += k * Math.PI * 2;
      else pacV.rider.rotation.x -= k * Math.PI * 2;
    } else if (moving) {
      splash(new THREE.Vector3(px - pac.drift * 0.6, 0, pz - 0.8), 3, 0.1);
    }
  }
  if (pac.mode === 'dive' || pacDepth < -0.5) {
    pacV.rider.rotation.x += 0.2;
    if (frame % 3 === 0) {
      const p = pacV.group.position.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.4, 0.8, (Math.random() - 0.5) * 0.4));
      spawn(foam, p, new THREE.Vector3((Math.random() - 0.5) * 0.01, 0.03, (Math.random() - 0.5) * 0.01), 0.05 + Math.random() * 0.05, 70, {gravity: -0.0006});
    }
  }
  if (beerTime > 0) pacV.rider.rotation.z += Math.sin(time * 3) * 0.25;

  // Bloodshot, droopy eyes after the joint.
  const high = redEyes > 0;
  pacV.eyeMat.color.set(high ? 0xff3030 : 0xffffff);
  pacV.eyeMat.emissive.set(high ? 0x9a0000 : 0x000000);
  pacV.lids.forEach(l => { l.visible = high; });

  mouthJoint.visible = jointTime > 0;
  if (jointTime > 0) {
    const tip = mouthJoint.userData.ember.getWorldPosition(new THREE.Vector3());
    if (frame % 3 === 0) {
      spawn(smoke, tip, new THREE.Vector3((Math.random() - 0.5) * 0.01, 0.02 + Math.random() * 0.01, (Math.random() - 0.5) * 0.01), 0.08, 120, {gravity: -0.0002, grow: 6});
    }
    if (frame % 50 === 0) {
      // A big exhale out the front of his mouth.

      const mouth = pacV.group.position.clone().add(new THREE.Vector3(0, 0.75, 0)).addScaledVector(fwd, 0.6);
      for (let i = 0; i < 14; i++) {
        const v = fwd.clone().multiplyScalar(0.03 + Math.random() * 0.03).add(new THREE.Vector3((Math.random() - 0.5) * 0.03, 0.01 + Math.random() * 0.02, (Math.random() - 0.5) * 0.03));
        spawn(smoke, mouth.clone(), v, 0.15, 160, {gravity: -0.0002, grow: 8});
      }
    }
    if (frame % 4 === 0) {
      // A haze that hangs around him.

      const p = pacV.group.position.clone().add(new THREE.Vector3(Math.cos(a) * r, 0.3 + Math.random() * 0.6, Math.sin(a) * r));

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pac-Man Clone</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; color: #eee; font-family: system-ui, sans-serif; }
  #hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; margin: 12px 16px; font-size: 18px; }
  #hud b { color: #ffe000; }
  canvas { max-width: calc(100vw - 32px); height: auto; touch-action: none; }
  p { color: #aaa; font-size: 14px; margin: 10px 16px; text-align: center; }
</style>
</head>
<body>
<div id="hud">
  <span>Score <b id="score">0</b></span>
  <span>Best <b id="best">0</b></span>
  <span>Level <b id="level">1</b></span>
  <span>Lives <b id="lives">3</b></span>
</div>
<canvas id="game"></canvas>
<p>Arrow keys / WASD to move &middot; Space to pause &middot; Enter to start &middot; Swipe on mobile</p>
<script>
// # wall, . dot, o power pellet, - ghost-house door, space = empty path
const MAP = [
  '###################',
  '#........#........#',
  '#o##.###.#.###.##o#',
  '#.................#',
  '#.##.#.#####.#.##.#',
  '#....#...#...#....#',
  '####.###.#.###.####',
  '####.#.......#.####',
  '####.#.##-##.#.####',
  ' ......#   #...... ',
  '####.#.#####.#.####',
  '####.#.......#.####',
  '####.#.#####.#.####',
  '#........#........#',
  '#.##.###.#.###.##.#',
  '#o.#..... .....#.o#',
  '##.#.#.#####.#.#.##',
  '#....#...#...#....#',
  '#.######.#.######.#',
  '#.................#',
  '###################',
];
const W = 19, H = 21, T = 24;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W * T;
canvas.height = H * T;

const UP = {x: 0, y: -1}, LEFT = {x: -1, y: 0}, DOWN = {x: 0, y: 1}, RIGHT = {x: 1, y: 0}, NONE = {x: 0, y: 0};
const DIRS = [UP, LEFT, DOWN, RIGHT];
const MODES = [7, 20, 7, 20, 5, 20, 5, Infinity]; // seconds, alternating scatter / chase
const HOME = {x: 9, y: 9}, EXIT = {x: 9, y: 7};
const GHOSTS = [
  {name: 'blinky', color: '#ff0000', start: {x: 9, y: 7}, dir: LEFT, corner: {x: W - 2, y: -2}, release: 0},
  {name: 'pinky', color: '#ffb8ff', start: {x: 9, y: 9}, dir: UP, corner: {x: 1, y: -2}, release: 2},
  {name: 'inky', color: '#00ffff', start: {x: 8, y: 9}, dir: RIGHT, corner: {x: W - 1, y: H + 1}, release: 5},
  {name: 'clyde', color: '#ffb852', start: {x: 10, y: 9}, dir: LEFT, corner: {x: 0, y: H + 1}, release: 8},
];

let dots, dotsLeft, pac, queued, ghosts, popups;
let score = 0, lives = 3, level = 1, state = 'start', timer = 0, paused = false;
let frame = 0, roundTime = 0, modeIndex = 0, modeTime = 0, frightTime = 0, combo = 0, freeze = 0;
let best = 0;
try { best = Number(localStorage.getItem('pacBest')) || 0; } catch (e) {}

const isWall = (x, y) => x < 0 || x >= W || y < 0 || y >= H || MAP[y][x] === '#';
const opposite = (a, b) => (a.x || a.y) && a.x === -b.x && a.y === -b.y;
const rpos = e => ({x: e.x + e.dir.x * e.p, y: e.y + e.dir.y * e.p});

function open(x, y, d, doorOK) {
  const nx = (x + d.x + W) % W, ny = y + d.y;
  if (ny < 0 || ny >= H) return false;
  const c = MAP[ny][nx];
  return c !== '#' && (c !== '-' || doorOK);
}

function loadDots() {
  dots = MAP.map(row => row.split('').map(c => (c === '.' || c === 'o') ? c : ''));
  dotsLeft = dots.flat().filter(Boolean).length;
}

function resetPositions() {
  pac = {x: 9, y: 15, dir: NONE, face: LEFT, p: 0};
  queued = LEFT;
  ghosts = GHOSTS.map(g => ({...g, x: g.start.x, y: g.start.y, p: 0, state: g.release ? 'house' : 'active', fright: false}));
  popups = [];
  roundTime = modeIndex = modeTime = frightTime = freeze = 0;
}

function startLevel() { loadDots(); resetPositions(); state = 'ready'; timer = 120; }
function newGame() { score = 0; lives = 3; level = 1; paused = false; startLevel(); }

function addScore(n) {
  score += n;
  if (score > best) {
    best = score;
    try { localStorage.setItem('pacBest', best); } catch (e) {}
  }
}

// Move an entity toward the next tile; onArrive runs each time it reaches a tile center.
function advance(e, speed, onArrive) {
  if (!e.dir.x && !e.dir.y) return;
  e.p += speed;
  while (e.p >= 1) {
    e.p -= 1;
    e.x = (e.x + e.dir.x + W) % W;
    e.y += e.dir.y;
    onArrive(e);
    if (!e.dir.x && !e.dir.y) { e.p = 0; return; }
  }
}

// Turn around mid-tile: target the tile we came from.
function reverse(e) {
  if (!e.dir.x && !e.dir.y) return;
  e.x = (e.x + e.dir.x + W) % W;
  e.y += e.dir.y;
  e.p = 1 - e.p;
  e.dir = {x: -e.dir.x, y: -e.dir.y};
}

function updatePac() {
  if (!pac.dir.x && !pac.dir.y) {
    if (open(pac.x, pac.y, queued)) pac.dir = queued;
  } else if (opposite(queued, pac.dir)) {
    reverse(pac);
  }
  if (pac.dir.x || pac.dir.y) pac.face = pac.dir;
  advance(pac, Math.min(0.16, 0.125 + 0.005 * (level - 1)), pacArrive);
}

function pacArrive() {
  const d = dots[pac.y][pac.x];
  if (d) {
    dots[pac.y][pac.x] = '';
    dotsLeft--;
    addScore(d === 'o' ? 50 : 10);
    if (d === 'o') frighten();
    if (!dotsLeft) { state = 'clear'; timer = 150; }
  }
  if (open(pac.x, pac.y, queued)) pac.dir = queued;
  else if (!open(pac.x, pac.y, pac.dir)) pac.dir = NONE;
}

function frighten() {
  frightTime = Math.max(2, 7 - level) * 60;
  combo = 0;
  for (const g of ghosts) {
    if (g.state === 'active') { g.fright = true; reverse(g); }
  }
}

function target(g) {
  if (g.state === 'eaten') return HOME;
  if (g.state === 'leaving') return EXIT;
  if (modeIndex % 2 === 0) return g.corner;
  const d = pac.face;
  switch (g.name) {
    case 'pinky': return {x: pac.x + 4 * d.x, y: pac.y + 4 * d.y};
    case 'inky': {
      const b = ghosts[0];
      return {x: 2 * (pac.x + 2 * d.x) - b.x, y: 2 * (pac.y + 2 * d.y) - b.y};
    }
    case 'clyde': return (g.x - pac.x) ** 2 + (g.y - pac.y) ** 2 > 64 ? pac : g.corner;
    default: return pac;
  }
}

function chooseDir(g) {
  const doorOK = g.state === 'leaving' || g.state === 'eaten';
  const opts = DIRS.filter(d => !opposite(d, g.dir) && open(g.x, g.y, d, doorOK));
  if (!opts.length) return {x: -g.dir.x, y: -g.dir.y};
  if (g.fright) return opts[Math.floor(Math.random() * opts.length)];
  const t = target(g);
  let pick = opts[0], pickDist = Infinity;
  for (const d of opts) {
    const dist = (g.x + d.x - t.x) ** 2 + (g.y + d.y - t.y) ** 2;
    if (dist < pickDist) { pickDist = dist; pick = d; }
  }
  return pick;
}

function ghostArrive(g) {
  if (g.state === 'leaving' && g.x === EXIT.x && g.y === EXIT.y) {
    g.state = 'active';
  } else if (g.state === 'eaten' && g.x === HOME.x && g.y === HOME.y) {
    g.state = 'leaving';
    g.dir = NONE;
  }
  g.dir = chooseDir(g);
}

function ghostSpeed(g) {
  if (g.state === 'eaten') return 0.25;
  if (g.state === 'leaving') return 0.08;
  if (g.fright || (g.y === 9 && (g.x <= 4 || g.x >= 14))) return 0.06;
  return Math.min(0.155, 0.115 + 0.006 * (level - 1));
}

function updateGhost(g) {
  if (g.state === 'house') {
    if (roundTime < g.release * 60) return;
    g.state = 'leaving';
  }
  advance(g, ghostSpeed(g), ghostArrive);
}

function checkCollisions() {
  const pp = rpos(pac);
  for (const g of ghosts) {
    if (g.state !== 'active') continue;
    const gp = rpos(g);
    if ((pp.x - gp.x) ** 2 + (pp.y - gp.y) ** 2 > 0.4) continue;
    if (g.fright) {
      g.fright = false;
      g.state = 'eaten';
      combo++;
      const pts = 200 * 2 ** (combo - 1);
      addScore(pts);
      popups.push({x: gp.x, y: gp.y, text: pts, t: 60});
      freeze = 30;
    } else {
      state = 'dying';
      timer = 90;
      return;
    }
  }
}

function step() {
  frame++;
  popups.forEach(p => p.t--);
  popups = popups.filter(p => p.t > 0);
  if (state === 'ready') { if (--timer <= 0) state = 'play'; return; }
  if (state === 'dying') {
    if (--timer > 0) return;
    if (--lives <= 0) state = 'over';
    else { resetPositions(); state = 'ready'; timer = 90; }
    return;
  }
  if (state === 'clear') { if (--timer <= 0) { level++; startLevel(); } return; }
  if (state !== 'play' || paused) return;
  if (freeze > 0) { freeze--; return; }

  roundTime++;
  if (frightTime > 0) {
    if (--frightTime === 0) ghosts.forEach(g => { g.fright = false; });
  } else if (++modeTime >= MODES[modeIndex] * 60) {
    modeIndex++;
    modeTime = 0;
    ghosts.forEach(g => { if (g.state === 'active') reverse(g); });
  }

  updatePac();
  if (state !== 'play') return;
  checkCollisions();
  if (state !== 'play') return;
  ghosts.forEach(updateGhost);
  checkCollisions();
}

function drawMaze() {
  const flash = state === 'clear' && Math.floor(timer / 15) % 2;
  ctx.fillStyle = '#000018';
  ctx.strokeStyle = flash ? '#fff' : '#2121de';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (MAP[y][x] !== '#') continue;
      const px = x * T, py = y * T;
      ctx.fillRect(px, py, T, T);
      if (!isWall(x, y - 1)) { ctx.moveTo(px, py); ctx.lineTo(px + T, py); }
      if (!isWall(x, y + 1)) { ctx.moveTo(px, py + T); ctx.lineTo(px + T, py + T); }
      if (!isWall(x - 1, y)) { ctx.moveTo(px, py); ctx.lineTo(px, py + T); }
      if (!isWall(x + 1, y)) { ctx.moveTo(px + T, py); ctx.lineTo(px + T, py + T); }
    }
  }
  ctx.stroke();
  ctx.fillStyle = '#ffb8ff';
  ctx.fillRect(9 * T, 8 * T + T / 2 - 2, T, 4);
}

function drawDots() {
  ctx.fillStyle = '#ffb8ae';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const d = dots[y][x];
      if (!d) continue;
      const cx = (x + 0.5) * T, cy = (y + 0.5) * T;
      if (d === '.') {
        ctx.fillRect(cx - 2, cy - 2, 4, 4);
      } else if (state !== 'play' || Math.floor(frame / 12) % 2) {
        ctx.beginPath();
        ctx.arc(cx, cy, T * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawPac() {
  if (state === 'over') return;
  const {x, y} = rpos(pac);
  const cx = (x + 0.5) * T, cy = (y + 0.5) * T;
  let mouth, ang;
  if (state === 'dying') {
    mouth = 0.1 + (1 - timer / 90) * Math.PI;
    ang = -Math.PI / 2;
  } else {
    const moving = state === 'play' && !paused && (pac.dir.x || pac.dir.y);
    mouth = moving ? 0.05 + Math.abs(Math.sin(frame * 0.3)) * 0.7 : 0.35;
    ang = Math.atan2(pac.face.y, pac.face.x);
  }
  if (mouth >= Math.PI) return;
  ctx.fillStyle = '#ffe000';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, T * 0.45, ang + mouth, ang + 2 * Math.PI - mouth);
  ctx.closePath();
  ctx.fill();
}

function drawGhost(g) {
  const {x, y} = rpos(g);
  const px = x * T, py = y * T, cx = px + T / 2;
  const flashing = frightTime < 120 && Math.floor(frame / 10) % 2;
  if (g.state !== 'eaten') {
    const l = px + T * 0.05, r = px + T * 0.95, bottom = py + T * 0.95;
    ctx.fillStyle = g.fright ? (flashing ? '#fff' : '#2121ff') : g.color;
    ctx.beginPath();
    ctx.arc(cx, py + T * 0.45, T * 0.45, Math.PI, 0);
    ctx.lineTo(r, bottom);
    for (let i = 1; i <= 6; i++) ctx.lineTo(r - (r - l) * i / 6, i % 2 ? bottom - T * 0.15 : bottom);
    ctx.closePath();
    ctx.fill();
  }
  if (g.fright) {
    const c = flashing ? '#f00' : '#ffb8ae';
    ctx.fillStyle = ctx.strokeStyle = c;
    ctx.fillRect(cx - T * 0.2, py + T * 0.32, T * 0.12, T * 0.12);
    ctx.fillRect(cx + T * 0.08, py + T * 0.32, T * 0.12, T * 0.12);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx - T * 0.3, py + T * 0.7);
    for (let i = 1; i <= 6; i++) ctx.lineTo(cx - T * 0.3 + i * T * 0.1, py + T * (i % 2 ? 0.62 : 0.7));
    ctx.stroke();
    return;
  }
  const d = g.dir, ey = py + T * 0.4;
  for (const ex of [cx - T * 0.18, cx + T * 0.18]) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ex + d.x * T * 0.04, ey + d.y * T * 0.04, T * 0.13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2121de';
    ctx.beginPath();
    ctx.arc(ex + d.x * T * 0.09, ey + d.y * T * 0.09, T * 0.065, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawText(text, y, color, size) {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, y);
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawMaze();
  drawDots();
  if (state !== 'clear' && state !== 'dying') ghosts.forEach(drawGhost);
  drawPac();

  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of popups) ctx.fillText(p.text, (p.x + 0.5) * T, (p.y + 0.5) * T);

  if (state === 'ready') drawText('READY!', 11.5 * T, '#ffe000', 20);
  if (state === 'start' || state === 'over' || paused) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const mid = canvas.height / 2;
    if (state === 'start') {
      drawText('PAC-MAN', mid - 30, '#ffe000', 40);
      drawText('Press Enter or tap to start', mid + 20, '#fff', 18);
    } else if (state === 'over') {
      drawText('GAME OVER', mid - 40, '#f00', 36);
      drawText(`Score: ${score}`, mid + 5, '#fff', 20);
      drawText('Press Enter or tap to play again', mid + 40, '#fff', 16);
    } else {
      drawText('PAUSED', mid - 10, '#fff', 32);
      drawText('Press Space to resume', mid + 25, '#fff', 16);
    }
  }

  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('level').textContent = level;
  document.getElementById('lives').textContent = lives;
}

const KEYS = {arrowup: UP, w: UP, arrowdown: DOWN, s: DOWN, arrowleft: LEFT, a: LEFT, arrowright: RIGHT, d: RIGHT};
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) queued = KEYS[k];
  else if (k === 'enter' && (state === 'start' || state === 'over')) newGame();
  else if ((k === ' ' || k === 'p') && state === 'play') paused = !paused;
  else return;
  e.preventDefault();
});

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'start' || state === 'over') { newGame(); return; }
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchStart) return;
  const t = e.touches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  queued = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
  touchStart = {x: t.clientX, y: t.clientY};
}, {passive: false});
canvas.addEventListener('click', () => { if (state === 'start' || state === 'over') newGame(); });

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
loadDots();
resetPositions();
requestAnimationFrame(loop);
</script>
</body>
</html>

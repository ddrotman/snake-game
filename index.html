const MAD_RED = new THREE.Color(0xff3a1f);
// His girlfriend surfs his line a few board-lengths behind him.
function updateGirlfriend(dt) {
  const head = pacV.group.position;
  if (trailReset) {
    trail.length = 0;
    for (let i = 20; i >= 0; i--) trail.push(new THREE.Vector3(head.x + i * 0.2, 0, head.z));
    trailReset = false;
  }
  const last = trail[trail.length - 1];
  if (last.distanceTo(tmpV.set(head.x, 0, head.z)) > 0.08) trail.push(new THREE.Vector3(head.x, 0, head.z));
  if (trail.length > 400) trail.shift();
  let idx = trail.length - 1, dist = 0;
  while (idx > 0 && dist < (gfMad > 0 ? 7 : 3.6) + gfFat * 1.4) {
    const stepLen = trail[idx].distanceTo(trail[idx - 1]);
    if (stepLen > 3) break;
    dist += stepLen;
    idx--;
  }
  const p = trail[idx], next = trail[Math.min(trail.length - 1, idx + 3)];
  gfV.group.visible = state !== 'over';
  const moved = gfV.group.position.distanceTo(tmpV.set(p.x, gfV.group.position.y, p.z)) > 0.005;
  gfV.group.position.set(p.x, waveH(p.z), p.z);
  const heading = next.distanceTo(p) > 0.01 ? Math.atan2(next.x - p.x, next.z - p.z) : gfV.heading;
  rideSurfer(gfV, heading, moved && state === 'play', dt, 9);
  if (beerTime > 0) {
    gfV.rider.rotation.z += Math.sin(time * 2.7) * 0.3;
    hiccup(gfV.group.position, 1);
  }
  if (discoTime > 0) gfV.rider.position.y += Math.abs(Math.sin(time * 8 + 1)) * 0.3;

  // Every stingray she eats shows up on her waistline.
  const wide = 1 + gfFat * 0.17;
  gfV.body.scale.x += (wide - gfV.body.scale.x) * Math.min(1, dt * 3);
  gfV.body.scale.z = gfV.body.scale.x;
  gfV.body.scale.y = 1 + (gfV.body.scale.x - 1) * 0.3;
  gfV.board[0].scale.x = 0.5 * (1 + (gfV.body.scale.x - 1) * 0.6);
  gfV.glam.forEach(m => { m.visible = gfGlam; });
  gfV.mat.emissive.set(gfGlam ? 0x3a1428 : 0x000000);
  if (gfGlam && frame % 7 === 0) {
    const a = Math.random() * Math.PI * 2;
    const p = gfV.group.position.clone().add(new THREE.Vector3(Math.cos(a) * 0.9, 0.4 + Math.random() * 1.2, Math.sin(a) * 0.9));
    spawn(foam, p, new THREE.Vector3(0, 0.01, 0), 0.05, 40, {color: GOLD, gravity: -0.0002});
  }

  // Mad at him for smoking: red-faced, scowling, fuming.
  const mad = gfMad > 0;
  gfV.brows.forEach(b => { b.visible = mad; });
  gfV.mat.color.copy(gfV.baseColor).lerp(MAD_RED, mad ? 0.55 + 0.25 * Math.sin(time * 8) : 0);
  if (mad) {
    gfV.rider.rotation.y = Math.sin(time * 14) * 0.06;
    if (frame % 5 === 0) {
      for (const s of [-1, 1]) {
        const p = gfV.group.position.clone().add(new THREE.Vector3(s * 0.3, 1.45, 0));
        spawn(smoke, p, new THREE.Vector3(s * 0.01, 0.045, 0), 0.1, 45, {gravity: -0.0005, grow: 3});
      }
    }
  }
  const newHeart = () => hearts.find(h => !h.visible);
  if (gfForgive) {
    gfForgive = 0;
    for (let i = 0; i < 8; i++) {
      const h = newHeart();
      if (!h) break;
      h.visible = true;
      h.userData.life = 90 + i * 6;
      h.position.copy(gfV.group.position).add(new THREE.Vector3((Math.random() - 0.5) * 1.5, 1.2 + Math.random(), (Math.random() - 0.5) * 1.5));
    }
  }
  if (state === 'play' && !mad && frame % (gfGlam ? 25 : 60) === 0) {
    const h = newHeart();
    if (h) {
      h.visible = true;
      h.userData.life = 90;
      h.position.copy(gfV.group.position).add(new THREE.Vector3(0, 1.4, 0));
    }
  }
  for (const h of hearts) {
    if (!h.visible) continue;
    h.userData.life--;
    h.position.y += 0.02;
    h.rotation.y += 0.05;
    h.scale.setScalar(Math.min(1, h.userData.life / 30));
    if (h.userData.life <= 0) h.visible = false;
  }
}

// Drunk hiccup bubbles over someone's head.
function hiccup(pos, seed) {
  if ((frame + seed * 17) % 45 !== 0) return;
  for (let i = 0; i < 4; i++) {
    const p = pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.4, 1.3 + Math.random() * 0.3, (Math.random() - 0.5) * 0.4));
    spawn(foam, p, new THREE.Vector3(0, 0.02 + Math.random() * 0.01, 0), 0.07 + Math.random() * 0.05, 50, {color: GOLD, gravity: -0.0003});
  }
}

let hookedPos = null;
function updateRays(dt) {
  hookedPos = null;
  const flashing = frightTime < 120 && Math.floor(frame / 10) % 2;
  ghosts.forEach((g, i) => {
    const v = rayViews[i];
    const {x, y} = rpos(g);
    v.group.visible = state !== 'clear' && state !== 'dying' && state !== 'travel';
    v.group.position.set(wx(x), 0.12 + waveH(wz(y)) + Math.sin(time * 2.6 + i * 1.7) * 0.05, wz(y));
    if (g.dir.x || g.dir.y) v.heading += angleDiff(v.heading, headingOf(g.dir)) * Math.min(1, dt * 10);
    v.group.rotation.y = v.heading + (discoTime > 0 ? time * 4 : 0);
    v.group.rotation.z = beerTime > 0 ? Math.sin(time * 3 + i) * 0.4 : 0;
    const lift = g.abducted > 0 && ufo ? Math.min(1, Math.max(0, (ufo.t - 120) / 150)) : 0;
    v.group.position.y += lift * 9;
    v.group.rotation.y += lift * time * 6;
    v.group.scale.setScalar(1.2 * (1 - lift * 0.6));
    if (g.hooked > 0) {
      const k = 1 - g.hooked / HOOK_TIME, from = v.group.position.clone();
      const pacPos = pacV.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
      const gfPos = gfV.group.position.clone().add(new THREE.Vector3(0, 1, 0));
      if (k < 0.55) v.group.position.lerpVectors(from, pacPos, k / 0.55).y += Math.sin(Math.PI * k / 0.55) * 1.5;
      else v.group.position.lerpVectors(pacPos, gfPos, (k - 0.55) / 0.45).y += Math.sin(Math.PI * (k - 0.55) / 0.45) * 3;
      v.group.rotation.x = time * 8;
      v.group.scale.multiplyScalar(1 - Math.max(0, (k - 0.8) / 0.2));
      if (k < 0.55) hookedPos = v.group.position;
    } else {
      v.group.rotation.x = 0;
    }
    if (beerTime > 0) {
      v.group.position.x += Math.sin(time * 2.3 + i) * 0.35;
      v.group.position.z += Math.cos(time * 1.9 + i) * 0.35;
      hiccup(v.group.position, i + 2);
    }

    const eaten = g.state === 'eaten';
    v.bodyMesh.visible = v.tail.visible = !eaten;
    const col = g.fright ? (flashing ? 0xffffff : 0x1d3bff) : null;
    v.mat.color.set(col ?? v.base);
    v.mat.emissive.set(col ?? v.base);
    v.light.color.set(col ?? v.base);
    v.light.intensity = eaten ? 0 : 10;
    v.pupils.forEach(p => { p.visible = !g.fright; });
    v.eyeWhite.color.set(g.fright ? 0xffc8a8 : 0xffffff);
    if (!eaten) {
      shapeRay(v.geo, time * timeScale() + i, g.fright ? 1.4 : 1);
      v.tail.rotation.y = Math.sin(time * 5 * timeScale() + i) * 0.25;
    }
  });
}

function updateCrabs(dt) {
  crabViews.forEach((v, i) => {
    const c = crabs[i];
    v.group.visible = !!c && state !== 'over' && state !== 'travel';
    if (!v.group.visible) return;
    const {x, y} = rpos(c);
    const moving = state === 'play' && !paused && (c.dir.x || c.dir.y);
    let lift = 0, push = 0;
    if (c.flung) {
      const f = 1 - c.flung / 80;
      lift = 14 * f * (1 - f);
      if (c.thrown) push = f * 12; // the wave carries it off to the south
      v.group.rotation.x += 0.4;
    } else {
      v.group.rotation.x = 0;
    }
    v.group.position.set(wx(x), 0.02 + waveH(wz(y)) + lift, wz(y) + push);
    v.group.rotation.z = beerTime > 0 ? Math.sin(time * 4 + i) * 0.4 : 0;
    if (beerTime > 0) hiccup(v.group.position, i + 7);
    // Crabs walk sideways, so they face across their direction of travel.
    if (c.dir.x || c.dir.y) v.heading += angleDiff(v.heading, headingOf(c.dir) + Math.PI / 2) * Math.min(1, dt * 8);
    v.group.rotation.y = v.heading + (discoTime > 0 ? time * 3 : 0);
    const t = time * 16 * timeScale();
    for (const leg of v.legs) {
      const {side, k} = leg.userData;
      leg.rotation.x = moving ? Math.sin(t + k * 2 + (side > 0 ? Math.PI : 0)) * 0.35 : 0;
    }
    const snap = Math.abs(Math.sin(time * (pac.stun > 0 ? 20 : 3) + i)) * 0.35;
    for (const arm of v.claws) {
      arm.userData.top.rotation.x = -snap;
      arm.userData.bottom.rotation.x = snap;
    }
  });
}

function updateItemViews() {
  for (const [it, mesh] of itemViews) {
    if (!items.includes(it) || state === 'travel') { scene.remove(mesh); itemViews.delete(it); }
  }
  for (const it of items) {
    let mesh = itemViews.get(it);
    if (!mesh) { mesh = makeItem(it.type); itemViews.set(it, mesh); }
    const z = wz(it.y);
    mesh.position.set(wx(it.x), waveH(z), z);
    const {holder, prop} = mesh.userData;
    holder.position.y = 0.55 + Math.sin(time * 2.5 + it.x) * 0.1;
    holder.rotation.set(0.35 * Math.sin(time * 1.3), time * 1.2, it.type === 'joint' ? 0.25 : 0.2 * Math.sin(time * 1.7));
    mesh.visible = it.t < 780 || Math.floor(it.t / 8) % 2 === 0; // blink before it drifts away
    if (it.type === 'joint' && frame % 6 === 0) {
      spawn(smoke, prop.userData.ember.getWorldPosition(new THREE.Vector3()), new THREE.Vector3(0, 0.015, 0), 0.05, 90, {gravity: -0.0002, grow: 4});
    }
  }
}

function updateWaveView() {
  waveMesh.visible = !!wave;
  water.material.uniforms.distortionScale.value = wave ? 2.2 : 1.1;
  if (!wave) return;
  const z = wz(wave.row);
  waveMesh.position.z = z;
  for (let i = 0; i < 6; i++) {
    const p = new THREE.Vector3((Math.random() - 0.5) * (WAVE_SPAN - 10), waveMesh.scale.y * 0.95, z + 0.3);
    spawn(foam, p, new THREE.Vector3((Math.random() - 0.5) * 0.02, 0.03 + Math.random() * 0.03, 0.05 + Math.random() * 0.04), 0.1 + Math.random() * 0.1, 30 + Math.random() * 20);
  }
}

function updateCamera(dt) {
  let pos, look, close = false;
  if (state === 'start') {
    const a = time * 0.07;
    look = new THREE.Vector3(0, 5, 0);
    pos = new THREE.Vector3(Math.sin(a) * 44, 17, Math.cos(a) * 44);
  } else if (state === 'travel') {
    look = new THREE.Vector3(0, 0, -30);
    pos = new THREE.Vector3(0, 60, 50);
  } else if (pac.mode === 'dive' && state === 'play') {
    // Close behind him underwater, looking where he's swimming.
    const p = pacV.group.position, fwd = new THREE.Vector3(Math.sin(pacV.heading), 0, Math.cos(pacV.heading));
    pos = p.clone().addScaledVector(fwd, -3.2).add(new THREE.Vector3(0, 0.7, 0));
    look = p.clone().addScaledVector(fwd, 4).add(new THREE.Vector3(0, -0.1, 0));
    close = true;
  } else if (pac.mode === 'surf' && state === 'play') {
    // Over his shoulder on the face of the wave.
    const p = pacV.group.position;
    pos = p.clone().add(new THREE.Vector3(0, 2.4, -4.6));
    look = p.clone().add(new THREE.Vector3(0, -0.6, 7));
    close = true;
  } else if (camMode === 'overview' || state === 'over') {
    const fit = Math.max(1, 1.25 / camera.aspect);
    look = new THREE.Vector3(0, 0, 2);
    pos = new THREE.Vector3(0, 46 * fit, 30 * fit);
  } else {
    const p = pacV.group.position;
    const fit = Math.max(1, 0.9 / camera.aspect);
    look = new THREE.Vector3(p.x * 0.8, 0, p.z * 0.8 - 1);
    pos = new THREE.Vector3(p.x * 0.8, 16 * fit, p.z * 0.8 + 13 * fit);
  }
  if (jointTime > 0) pos.add(new THREE.Vector3(Math.sin(time * 0.8) * 1.2, Math.sin(time * 0.5) * 0.6, 0));
  camPos.lerp(pos, 1 - Math.exp(-dt * (state === 'travel' ? 1.2 : close ? 6 : 2.8)));
  camLook.lerp(look, 1 - Math.exp(-dt * (close ? 9 : 4.2)));
  const fov = pac.mode === 'surf' && state === 'play' ? 62 : 45;
  if (Math.abs(camera.fov - fov) > 0.05) {
    camera.fov += (fov - camera.fov) * Math.min(1, dt * 4);
    camera.updateProjectionMatrix();
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  if (beerTime > 0) camera.rotateZ(Math.sin(time * 1.4) * 0.07);
}

// ---------------------------------------------------------------- HUD & overlays
const $ = id => document.getElementById(id);
const hudCache = {};
function setText(id, value) {
  if (hudCache[id] !== value) { hudCache[id] = value; $(id).textContent = value; }
}

function updateOverlay() {
  let title = '', sub = '', dim = false;
  if (state === 'start') { title = 'PAC-MAN SURF'; sub = `${dest().name} · Press Enter or tap to start`; dim = true; }
  else if (state === 'ready') { title = 'READY!'; sub = dest().name; }
  else if (state === 'clear') title = 'LEVEL CLEAR!';
  else if (state === 'travel') { title = '✈️ Next stop'; sub = dest().name; dim = true; }
  else if (state === 'over') { title = 'GAME OVER'; sub = `Score ${score} · Press Enter or tap to play again`; dim = true; }
  else if (paused) { title = 'PAUSED'; sub = 'Press Space to resume'; dim = true; }
  setText('title', title);
  setText('sub', sub);
  $('overlay').classList.toggle('dim', dim);
  setText('score', score);
  setText('best', best);
  setText('level', level);
  setText('lives', lives);
  setText('place', `📍 ${dest().name}`);
  setText('beerCount', beerTime > 0 ? `${Math.ceil(beerTime / 60)}s` : inv.beer);
  setText('jointCount', jointTime > 0 ? `${Math.ceil(jointTime / 60)}s` : inv.joint);
  $('beerBtn').disabled = !inv.beer || state !== 'play';
  $('jointBtn').disabled = !inv.joint || state !== 'play';
  setText('diveCount', pac.mode === 'dive' ? `${Math.max(0, Math.ceil(pac.dive / 60))}s` : pac.diveCool > 0 ? `${Math.ceil(pac.diveCool / 60)}s` : 'X');
  $('diveBtn').disabled = state !== 'play' || pac.mode !== 'normal' || pac.diveCool > 0;
  const catchable = state === 'play' && pac.mode === 'normal' && wave && wave.row > rpos(pac).y - 3 && wave.row < rpos(pac).y + 1.5;
  $('surfBtn').disabled = !(state === 'play' && pac.mode === 'normal' && (wave || waveWarned));
  $('surfBtn').classList.toggle('pulse', !!catchable || (pac.wantsSurf && pac.mode === 'normal'));
  setText('fishCount', pac.fishCool > 30 ? `${Math.ceil(pac.fishCool / 60)}s` : 'G');
  $('fishBtn').disabled = state !== 'play' || pac.mode !== 'normal' || pac.fishCool > 0;
  const bubble = $('speech');
  bubble.style.opacity = speechTime > 0 && gfV.group.visible && state !== 'over' ? 1 : 0;
  setText('speech', speech);
  const head = gfV.group.position.clone().add(new THREE.Vector3(0, 2.3, 0)).project(camera);
  bubble.style.left = `${(head.x * 0.5 + 0.5) * innerWidth}px`;
  bubble.style.top = `${(-head.y * 0.5 + 0.5) * innerHeight}px`;
  setText('toast', toastMsg);
  $('toast').style.opacity = toastTime > 0 ? 1 : 0;
  $('haze').style.opacity = jointTime > 0 ? 1 : redEyes > 0 ? 0.35 : 0;
  $('smoke').style.opacity = jointTime > 0 ? 0.9 : redEyes > 0 ? 0.3 : 0;
  renderer.domElement.classList.toggle('high', jointTime > 0);
}

const popupEls = new Map();
function updatePopups() {
  for (const [p, el] of popupEls) if (!popups.includes(p)) { el.remove(); popupEls.delete(p); }
  for (const p of popups) {
    let el = popupEls.get(p);
    if (!el) {
      el = document.createElement('div');
      el.className = 'popup';
      el.textContent = p.text;
      document.body.appendChild(el);
      popupEls.set(p, el);
    }
    const v = new THREE.Vector3(wx(p.x), 1.6 + (60 - p.t) * 0.02, wz(p.y)).project(camera);
    el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
    el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
    el.style.opacity = Math.min(1, p.t / 20);
  }
}

// ---------------------------------------------------------------- input
const KEYS = {arrowup: UP, w: UP, arrowdown: DOWN, s: DOWN, arrowleft: LEFT, a: LEFT, arrowright: RIGHT, d: RIGHT};
// Drunk steering: everything is reversed, and sometimes you just go wherever.
// In the close-up dive and surf cameras, steering is relative: up is forward, left/right turn.
function steer(d) {
  if (pac.mode === 'dive' || pac.mode === 'surf') {
    const f = pac.mode === 'surf' ? DOWN : pac.face;
    d = d === UP ? f : d === DOWN ? {x: -f.x, y: -f.y} : d === LEFT ? {x: f.y, y: -f.x} : {x: -f.y, y: f.x};
  }
  if (beerTime > 0) {
    d = Math.random() < 0.1 ? DIRS[Math.floor(Math.random() * 4)] : {x: -d.x, y: -d.y};
  }
  if (pac.mode === 'surf') {
    if (d.y) doTrick(d.y > 0 ? 'spin' : 'flip'); // forward (south) is ↑ on the wave
    else pac.drift = d.x;
    return;
  }
  queued = d;
}
function toggleCamera() {
  camMode = camMode === 'follow' ? 'overview' : 'follow';
  $('view').textContent = `Camera: ${camMode === 'follow' ? 'Follow' : 'Overview'}`;
}
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) steer(KEYS[k]);
  else if (k === 'enter' && (state === 'start' || state === 'over')) newGame();
  else if ((k === ' ' || k === 'p') && state === 'play') paused = !paused;
  else if (k === 'c') toggleCamera();
  else if (k === 'b') useItem('beer');
  else if (k === 'j') useItem('joint');
  else if (k === 'x' || k === 'shift') startDive();
  else if (k === 'f') catchWave();
  else if (k === 'g') castLine();
  else return;
  e.preventDefault();
});
for (const [id, fn] of [['view', toggleCamera], ['beerBtn', () => useItem('beer')], ['jointBtn', () => useItem('joint')], ['diveBtn', startDive], ['surfBtn', catchWave], ['fishBtn', castLine]]) {
  $(id).addEventListener('click', e => { e.stopPropagation(); fn(); $(id).blur(); });
}

let touchStart = null;
const canvas = renderer.domElement;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'start' || state === 'over') { newGame(); return; }
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchStart) return;
  const t = e.touches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP));
  touchStart = {x: t.clientX, y: t.clientY};
}, {passive: false});
canvas.addEventListener('click', () => { if (state === 'start' || state === 'over') newGame(); });

// ---------------------------------------------------------------- main loop
applyDestination();
loadDots();
resetPositions();
const clock = new THREE.Clock();
let acc = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.1, clock.getDelta());
  acc += dt;
  while (acc >= 1 / 60) { step(); acc -= 1 / 60; }
  time += dt;
  water.material.uniforms.time.value += dt * 0.55 * (wave ? 1.6 : 1);
  if (discoTime > 0) trimMat.emissive.setHSL((time * 0.6) % 1, 1, 0.55);
  else trimMat.emissive.set(state === 'clear' && Math.floor(timer / 12) % 2 ? 0xffffff : 0x2b5cff);
  if (beach && beach.visible) {
    for (const c of palmCrowns) c.rotation.set(Math.sin(time * 0.9 + c.userData.phase) * 0.06, 0, Math.sin(time * 1.3 + c.userData.phase) * 0.08);
  }
  updatePearls();
  updatePacView(dt);
  updateGirlfriend(dt);
  updateRays(dt);
  updateCrabs(dt);
  updateItemViews();
  updateStarView();
  updateTreasureView();
  rod.visible = ghosts.some(g => g.hooked > 0);
  fishLine.visible = !!hookedPos;
  if (hookedPos) {
    const tip = rod.localToWorld(new THREE.Vector3(0, 1.8, 0));
    fishLine.geometry.attributes.position.setXYZ(0, tip.x, tip.y, tip.z);
    fishLine.geometry.attributes.position.setXYZ(1, hookedPos.x, hookedPos.y, hookedPos.z);
    fishLine.geometry.attributes.position.needsUpdate = true;
  }
  flashEl.style.opacity = flashTime > 0 ? (flashTime / 40) * 0.85 : 0;
  updateWaveView();
  updatePool(foam);
  updatePool(smoke);
  updateDolphins();
  updateGulls();
  updateWhale();
  updateUfo();
  updateDisco(dt);
  updateCamera(dt);
  // Below the surface: swap the sky and mirror water for fog, the seafloor and fish.
  const under = camera.position.y < 0;
  underwater.visible = under;
  water.visible = sky.visible = !under;
  scene.background = under ? UNDER_COLOR : null;
  underFog.density = under ? 0.045 : 0;
  if (under) updateUnderwater();
  updateOverlay();
  updatePopups();
  composer.render();
}
// Test hook: inspect and drive the game from the browser console.
window.pacSurf = {
  get state() { return {state, score, lives, level, inv: {...inv}, beerTime, jointTime, redEyes, gfMad, speech: speechTime > 0 ? speech : '', discoTime, ufo: !!ufo, whale: !!whale, camY: camera.position.y, wave: wave && wave.row, pac: {...pac}, crabs: crabs.length, items: items.length, dotsLeft, place: dest().name}; },
  give(type, n = 1) { inv[type] += n; },
  wave() { waveClock = dest().waveEvery * 60; },
  clear() { for (const row of dots) row.fill(''); dotsLeft = 0; state = 'clear'; timer = 1; },
  warp(n) { level = n; applyDestination(); startLevel(); },
  dive() { startDive(); },
  fish() { castLine(); },
  tp(x, y) { pac.x = x; pac.y = y; pac.p = 0; pac.dir = NONE; },
  go(dx, dy) { queued = {x: dx, y: dy}; },
  star() { const [x, y] = randomTile(2); starfish = {x, y, t: 0}; },
  starAt(x, y) { starfish = {x, y, t: 0}; },
  get treasure() { return treasure; },
  get gf() { return {gfFat, gfGlam, gfMad}; },
  rays() { return ghosts.map(g => ({state: g.state, hooked: g.hooked, ...rpos(g)})); },
  surf() { catchWave(); },
  event(name) { triggerEvent(name); },
  spawnItem(type) { const [x, y] = randomTile(2); items.push({type, x, y, t: 0}); },
};
window.__started = true;
animate();
</script>

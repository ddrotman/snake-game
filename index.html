<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  canvas { background: #1b1b1b; border: 2px solid #444; max-width: 95vw; }
  #info { margin: 12px; font-size: 18px; }
</style>
</head>
<body>
<div id="info">Score: <span id="score">0</span> &middot; Best: <span id="best">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<p>Arrow keys / WASD to move &middot; Space to pause &middot; Swipe on mobile</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SIZE = 20, CELLS = canvas.width / SIZE;
let snake, dir, nextDir, food, score, paused, over;
let best = Number(localStorage.getItem('snakeBest') || 0);
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = nextDir = {x: 1, y: 0};
  score = 0; paused = false; over = false;
  placeFood(); updateScore();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function updateScore() {
  document.getElementById('score').textContent = score;
  if (score > best) { best = score; localStorage.setItem('snakeBest', best); }
  document.getElementById('best').textContent = best;
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return; // no reversing
  nextDir = {x, y};
}

function step() {
  if (paused || over) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    over = true; return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) { score++; updateScore(); placeFood(); }
  else snake.pop();
}

function draw() {
  ctx.fillStyle = '#1b1b1b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x * SIZE + 2, food.y * SIZE + 2, SIZE - 4, SIZE - 4);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
  if (over || paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '28px system-ui';
    ctx.fillText(over ? 'Game Over' : 'Paused', canvas.width / 2, canvas.height / 2);
    ctx.font = '16px system-ui';
    ctx.fillText(over ? 'Press Enter or tap to restart' : 'Press Space to resume', canvas.width / 2, canvas.height / 2 + 30);
  }
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') setDir(0, -1);
  else if (k === 'arrowdown' || k === 's') setDir(0, 1);
  else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
  else if (k === 'arrowright' || k === 'd') setDir(1, 0);
  else if (k === ' ') paused = !paused;
  else if (k === 'enter' && over) reset();
  else return;
  e.preventDefault();
});

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  if (over) { reset(); return; }
  touchStart = e.touches[0];
}, {passive: true});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.clientX, dy = t.clientY - touchStart.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
    if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
    else setDir(0, Math.sign(dy));
  }
  touchStart = null;
});

reset();
setInterval(() => { step(); draw(); }, 100);
</script>
</body>
</html>
